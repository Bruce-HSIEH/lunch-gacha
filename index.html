<title>台元午餐轉轉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6EA; --card:#FFFFFF; --ink:#5A4434; --ink2:#9A8574;
  --peach:#FFB59E; --peach-d:#F28C6E; --red:#FF8F78; --mint:#BFE6D6; --mint-d:#5DB596;
  --butter:#FFE08A; --lav:#D9CCF5; --sky:#BFDDF7; --pink:#FFD1DC; --line:#F0E2D2;
  --shadow:0 6px 0 #EBD8C3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","PingFang TC","Heiti TC","Noto Sans TC",system-ui,sans-serif;}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px);
  background-image:radial-gradient(#F6E6D3 1.2px,transparent 1.2px);background-size:18px 18px;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto}
button{font-family:inherit;color:inherit;cursor:pointer}
svg.ic{display:inline-block;vertical-align:middle;flex:none}

/* header */
header{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.mascot{width:66px;height:66px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.snd{margin-left:auto;display:flex;gap:6px;align-self:flex-start;margin-top:4px}
.snd button{width:40px;height:40px;border-radius:14px;border:2.5px solid var(--line);background:#fff;display:grid;place-items:center;padding:0;transition:.15s}
.snd button.off{opacity:.45;background:#F6E7D6}
.snd button:active{transform:scale(.9)}
h1{font-size:21px;margin:0;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.sub{font-size:13px;color:var(--ink2);margin-top:3px}

/* tabs */
.tabs{display:flex;background:#F6E7D6;border-radius:999px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 0;border-radius:999px;font-size:15px;font-weight:700;color:var(--ink2);transition:.2s;display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 #E6D2BC}

.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);border:2px solid var(--line);margin-bottom:16px}

/* ===== 扭蛋機 ===== */
.stage{text-align:center;padding:14px 10px 18px}
.gacha{position:relative;width:250px;margin:0 auto}
.lid{width:64px;height:30px;margin:0 auto -10px;background:var(--red);border:4px solid var(--ink);border-radius:34px 34px 8px 8px;position:relative;z-index:2}
.lid::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--butter);border:3px solid var(--ink);left:50%;top:-14px;transform:translateX(-50%)}
.globe{width:226px;height:226px;margin:0 auto;border-radius:50%;border:4px solid var(--ink);position:relative;overflow:hidden;z-index:1;
  background:radial-gradient(circle at 35% 30%,#FFFFFF 0%,#EEF7FD 55%,#DCEEFA 100%)}
.globe::after{content:"";position:absolute;left:30px;top:26px;width:46px;height:70px;border-radius:50%;border-left:7px solid rgba(255,255,255,.95);transform:rotate(18deg);z-index:5;pointer-events:none}
.cap{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);will-change:transform;
  background:linear-gradient(to bottom,var(--c) 0 50%,#FFFDF8 50% 100%)}
.cap::after{content:"";position:absolute;left:-3px;right:-3px;top:calc(50% - 1.5px);height:3px;background:var(--ink);opacity:.55}
.cap i{position:absolute;left:9px;top:7px;width:8px;height:5px;border-radius:50%;background:rgba(255,255,255,.9)}
.globe-shine{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:5;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.75) 0 9%,transparent 10%)}
.collar{width:150px;height:24px;margin:-16px auto 0;background:var(--butter);border:4px solid var(--ink);border-radius:12px;position:relative;z-index:3}
.body{width:244px;height:168px;margin:-4px auto 0;background:var(--red);border:4px solid var(--ink);border-radius:26px 26px 34px 34px;position:relative;z-index:2;
  box-shadow:inset 0 -12px 0 rgba(0,0,0,.07)}
.body.shake{animation:jiggle .14s linear infinite}
@keyframes jiggle{25%{transform:translateX(-2px) rotate(-.8deg)}75%{transform:translateX(2px) rotate(.8deg)}}
.sign{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#FFF6EA;border:3px solid var(--ink);border-radius:999px;padding:3px 14px;font-size:13.5px;font-weight:900;white-space:nowrap;display:flex;align-items:center;gap:4px}
.coin{position:absolute;right:30px;top:56px;width:40px;height:20px;background:#FFF6EA;border:3px solid var(--ink);border-radius:8px}
.coin::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:4px;border-radius:4px;background:var(--ink);transform:translate(-50%,-50%)}
.handle{position:absolute;right:22px;bottom:18px;width:60px;height:60px;border-radius:50%;background:var(--butter);border:4px solid var(--ink);transition:transform 1.6s cubic-bezier(.3,.1,.2,1)}
.handle::before{content:"";position:absolute;left:50%;top:50%;width:46px;height:14px;border-radius:8px;background:#fff;border:3px solid var(--ink);transform:translate(-50%,-50%)}
.handle::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:var(--red);border:3px solid var(--ink);transform:translate(-50%,-50%)}

.handle{cursor:pointer;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(255,224,138,.65)}}
.handle:active{filter:brightness(.95)}
.gacha.busy .handle{animation:none}
.callout{position:absolute;right:-50px;bottom:66px;z-index:6;pointer-events:none;animation:hop 1s ease-in-out infinite;transform-origin:left bottom}
.callout span{display:block;background:var(--butter);border:3px solid var(--ink);border-radius:14px;padding:3px 9px;font-size:15px;font-weight:900;white-space:nowrap;box-shadow:0 3px 0 rgba(90,68,52,.25);transform:rotate(6deg)}
.callout svg{display:block;margin:-2px 0 0 4px}
@keyframes hop{50%{transform:translate(-3px,-6px)}}
.gacha.busy .callout,.gacha.empty .callout{opacity:0;transition:.2s}
.gacha.empty .handle{animation:none;filter:grayscale(.6);opacity:.7}
.exit{position:absolute;left:24px;bottom:18px;width:82px;height:62px;background:var(--ink);border-radius:16px 16px 22px 22px;overflow:visible}
.exit::before{content:"";position:absolute;left:6px;right:6px;top:6px;height:22px;border-radius:10px 10px 4px 4px;background:rgba(255,255,255,.18)}
.feet{display:flex;justify-content:space-between;width:190px;margin:-4px auto 0}
.feet i{width:34px;height:14px;background:var(--ink);border-radius:0 0 10px 10px}
.outcap{position:absolute;left:18px;top:12px;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);opacity:0;z-index:4;
  background:linear-gradient(to bottom,var(--c,#FFB59E) 0 50%,#FFFDF8 50% 100%)}
.outcap.drop{animation:drop .9s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-34px) scale(.5) rotate(-90deg)}
  40%{opacity:1;transform:translateY(6px) scale(1.05) rotate(20deg)}
  60%{transform:translateY(-8px) scale(.98) rotate(-10deg)}
  80%{transform:translateY(2px) rotate(4deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
.ticker{height:28px;margin-top:14px;font-weight:700;font-size:16.5px;color:var(--ink2);overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px}

/* quick price */
.quick{margin:14px 0 14px;text-align:left}
.qlabel{font-size:13.5px;font-weight:900;margin:0 0 8px 2px;display:flex;align-items:center;gap:5px}
.qrow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.qrow .chip{padding:8px 0;font-size:12.5px;text-align:center;justify-content:center;letter-spacing:-.2px}

.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:20px;padding:15px;font-size:19px;font-weight:900;
  background:var(--mint-d);color:#fff;box-shadow:0 6px 0 #3F9378;transition:transform .08s,box-shadow .08s;letter-spacing:1px}
.bigbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #3F9378}
.bigbtn:disabled{opacity:.6}
.count{text-align:center;font-size:13px;color:var(--ink2);margin-top:10px}

/* chips */
.fgroup{margin-bottom:14px}
.flabel{font-size:14px;font-weight:900;margin:0 0 8px 2px;display:flex;align-items:center;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px 6px 9px;font-size:14px;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--butter);border-color:#F2C85B}
.chip[data-c="peach"].on{background:var(--peach);border-color:var(--peach-d)}
.chip[data-c="mint"].on{background:var(--mint);border-color:var(--mint-d)}
.chip[data-c="sky"].on{background:var(--sky);border-color:#86B9E6}
.toggle{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;padding:6px 2px}
.sw{width:50px;height:30px;border-radius:999px;background:#E9DCCD;border:0;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sw.on{background:var(--mint-d)}.sw.on::after{left:23px}

/* result */
.overlay{position:fixed;inset:0;background:rgba(90,68,52,.35);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.overlay.show{display:flex}
.result{width:100%;max-width:460px;background:#fff;border-radius:28px;padding:18px 18px 18px;text-align:center;border:3px solid var(--line);
  animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translateY(60px) scale(.8);opacity:0}}
.reveal{position:relative;width:120px;height:110px;margin:0 auto 4px}
.reveal .food{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.2);animation:grow .6s .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes grow{to{transform:translate(-50%,-50%) scale(1)}}
.reveal .food svg{animation:wiggle 1.4s 1s ease-in-out infinite}
@keyframes wiggle{50%{transform:rotate(7deg) scale(1.04)}}
.half{position:absolute;left:50%;width:70px;height:35px;border:3px solid var(--ink);margin-left:-35px;top:20px}
.half.top{border-radius:35px 35px 0 0;background:var(--c);border-bottom:none;animation:popTop .55s cubic-bezier(.3,.7,.4,1) forwards}
.half.bot{top:55px;border-radius:0 0 35px 35px;background:#FFFDF8;border-top:none;animation:popBot .55s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes popTop{to{transform:translate(-62px,-14px) rotate(-38deg);opacity:0}}
@keyframes popBot{to{transform:translate(62px,14px) rotate(32deg);opacity:0}}

/* Q 版小地圖 */
.mini{position:relative;margin:0 0 12px;border-radius:20px;overflow:hidden;border:3px solid var(--ink);background:#F3F9EC}
.mini > svg{display:block;width:100%;height:auto}
.eta{position:absolute;left:10px;top:10px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:5px 10px 5px 7px;text-align:left;box-shadow:0 3px 0 rgba(90,68,52,.18)}
.eta b{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:900}
.eta span{display:block;font-size:11.5px;color:var(--ink2);font-weight:700;margin-left:2px}
.result{max-height:calc(100vh - 32px);overflow-y:auto}
.r-hint{font-size:13px;color:var(--ink2);font-weight:700}
.r-name{font-size:24px;font-weight:900;margin:4px 0 10px}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:10px}
.tag{font-size:12.5px;font-weight:700;padding:3px 10px 3px 6px;border-radius:999px;background:#F7EEE4;display:inline-flex;align-items:center;gap:4px}
.tag.t1{background:var(--mint)}.tag.t2{background:var(--butter)}.tag.t3{background:var(--lav)}.tag.t4{background:var(--sky)}
.r-note{font-size:14px;color:var(--ink2);margin:0 4px 16px;line-height:1.55}
.r-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:16px;padding:12px 8px;font-size:15px;font-weight:900;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn.map{background:var(--sky);grid-column:1/-1}
.btn.go{background:var(--peach-d);color:#fff;box-shadow:0 4px 0 #D9714F}
.btn.again{background:#F6E7D6}
.confetti{position:fixed;top:-30px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(540deg)}}

/* list */
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.list-head h2{font-size:17px;margin:0;font-weight:900;display:flex;align-items:center;gap:6px}
.small{font-size:12px;color:var(--ink2);font-weight:500}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:2px dashed var(--line)}
.item:first-of-type{border-top:0}
.i-emo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.i-main{flex:1;min-width:0}
.i-name{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.i-meta{font-size:12px;color:var(--ink2);margin-top:2px}
.i-btn{border:0;background:#F6E7D6;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;flex:none}
.empty{text-align:center;color:var(--ink2);padding:18px 0;font-size:14px;line-height:1.6}

.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:13px;font-weight:700;margin:0 0 5px 2px}
.field input,.field select{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 12px;font-size:16px;font-family:inherit;color:var(--ink);background:#FFFCF8;appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}
footer{text-align:center;font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(80px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;transition:.3s;z-index:40;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="wrap">

<header>
  <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 8 C70 8 92 52 92 70 C92 86 78 92 50 92 C22 92 8 86 8 70 C8 52 30 8 50 8Z" fill="#fff" stroke="#5A4434" stroke-width="4"/>
    <path d="M24 66 H76 V86 Q50 92 24 86Z" fill="#4E5E4A" stroke="#5A4434" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="37" cy="52" r="4.5" fill="#5A4434"/><circle cx="63" cy="52" r="4.5" fill="#5A4434"/>
    <circle cx="38.5" cy="50.5" r="1.4" fill="#fff"/><circle cx="64.5" cy="50.5" r="1.4" fill="#fff"/>
    <ellipse cx="28" cy="60" rx="6" ry="3.5" fill="#FF9C86" opacity=".8"/><ellipse cx="72" cy="60" rx="6" ry="3.5" fill="#FF9C86" opacity=".8"/>
    <path d="M44 57 Q50 63 56 57" stroke="#5A4434" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>
  <div>
    <h1>台元午餐轉轉</h1>
    <div class="sub" id="greet">今天中午吃什麼？交給我！</div>
  </div>
  <div class="snd">
    <button id="bgmBtn" aria-label="背景音樂"></button>
    <button id="sfxBtn" aria-label="音效"></button>
  </div>
</header>

<div class="tabs" role="tablist">
  <button class="on" data-tab="random"><span data-ic="dice" data-s="20"></span>隨機</button>
  <button data-tab="filter"><span data-ic="search" data-s="20"></span>條件</button>
  <button data-tab="mine"><span data-ic="star" data-s="20"></span>我的</button>
</div>

<!-- 條件 -->
<section id="filterCard" class="card hidden">
  <div class="fgroup">
    <div class="flabel"><span data-ic="pin" data-s="18"></span>地區</div>
    <div class="chips" id="fRegion"></div>
  </div>
  <div class="fgroup">
    <div class="flabel"><span data-ic="car" data-s="18"></span>開車時間最多</div>
    <div class="chips" id="fTime"></div>
  </div>
  <div class="fgroup">
    <div class="flabel"><span data-ic="bowl" data-s="18"></span>想吃的類型 <span class="small">（不選＝都可以）</span></div>
    <div class="chips" id="fCuisine"></div>
  </div>
  <div class="toggle">避開最近 3 次吃過的<button class="sw on" id="avoidSw" aria-label="避開最近吃過"></button></div>
</section>

<!-- 扭蛋機 -->
<section id="machineCard" class="card stage">
  <div class="gacha">
    <div class="lid"></div>
    <div class="globe" id="globe"></div>
    <div class="collar"></div>
    <div class="body" id="mbody">
      <div class="sign"><span data-ic="spark" data-s="14"></span>午餐轉轉<span data-ic="spark" data-s="14"></span></div>
      <div class="coin"></div>
      <div class="exit"><div class="outcap" id="outcap"></div></div>
      <div class="handle" id="handle" role="button" tabindex="0" aria-label="轉扭蛋"></div>
      <div class="callout" id="callout"><span>轉我！</span>
        <svg width="34" height="30" viewBox="0 0 34 30"><path d="M28 3 Q30 20 10 24" fill="none" stroke="#5A4434" stroke-width="3.2" stroke-linecap="round"/><path d="M14 18 L8 24.5 L15.5 28" fill="none" stroke="#5A4434" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="feet"><i></i><i></i></div>
  </div>
  <div class="ticker" id="ticker">轉一下把手，命運幫你決定</div>

  <div class="quick">
    <div class="qlabel"><span data-ic="coin" data-s="18"></span>今天預算 <span class="small">（TWD／人，可複選，不選＝都可以）</span></div>
    <div class="qrow" id="fPrice"></div>
  </div>

  <div class="count" id="count"></div>
</section>

<!-- 我的 -->
<section id="mineCard" class="hidden">
  <div class="card">
    <div class="list-head"><h2><span data-ic="plus" data-s="20"></span>加入口袋名單</h2></div>
    <form id="addForm">
      <label class="field"><span>店名</span><input id="aName" required placeholder="例如：巷口那家咖哩" maxlength="30"></label>
      <div class="row2">
        <label class="field"><span>地區</span><select id="aArea"></select></label>
        <label class="field"><span>價位（TWD）</span><select id="aPrice"></select></label>
      </div>
      <label class="field"><span>類型</span><select id="aCuisine"></select></label>
      <button class="bigbtn" type="submit" style="font-size:16px;padding:13px">加進扭蛋機</button>
    </form>
  </div>
  <div class="card">
    <div class="list-head"><h2><span data-ic="clock" data-s="20"></span>最近吃過</h2><button class="i-btn" id="clearHist">清除</button></div>
    <div id="histList"></div>
  </div>
</section>

<section class="card" id="listCard">
  <div class="list-head"><h2 id="listTitle"></h2><button class="i-btn" id="toggleList">展開</button></div>
  <div id="list" class="hidden"></div>
</section>

<footer>
  車程與地圖皆為依區域估算的大概值，實際依路況。<br>
  店家資訊可能有變動，出發前用「導航」確認營業時間喔！
</footer>
</div>

<div class="overlay" id="overlay"><div class="result" id="result"></div></div>
<div class="toast" id="toast"></div>

<script>

const S = `stroke="${O}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;

    <path d="M-3 4 Q0 7 3 4" stroke="${O}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <ellipse cx="-11" cy="4.5" rx="3.2" ry="2" fill="#FF8F78" opacity=".55"/>
    <ellipse cx="11" cy="4.5" rx="3.2" ry="2" fill="#FF8F78" opacity=".55"/></g>`;
}
const FOOD = {
  tw: // 魯肉飯
    `<path d="M7 30 H57 Q55 55 32 55 Q9 55 7 30Z" fill="#FFB59E" ${S}/>
     <path d="M9 30 Q12 15 32 15 Q52 15 55 30Z" fill="#fff" ${S}/>

     ${face(32,42)}`,
  bento:
    `<rect x="6" y="14" width="52" height="40" rx="10" fill="#FFB59E" ${S}/>

function foodSVG(k,size=40){return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 64 64">${FOOD[k]}</svg>`;}

const UI = {
  dice:`<rect x="3" y="3" width="18" height="18" rx="5" fill="#fff" stroke="${O}" stroke-width="2"/><circle cx="8" cy="8" r="1.6" fill="${O}"/><circle cx="12" cy="12" r="1.6" fill="#F28C6E"/><circle cx="16" cy="16" r="1.6" fill="${O}"/>`,

  car:`<path d="M3 15 V12 Q3 10 5 10 L7.5 6 Q8.2 5 9.5 5 H14.5 Q15.8 5 16.5 6 L19 10 Q21 10 21 12 V15 Q21 16.5 19.5 16.5 H4.5 Q3 16.5 3 15Z" fill="#BFE6D6" stroke="${O}" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 10 L9.8 7 H14.2 L15.5 10Z" fill="#fff" stroke="${O}" stroke-width="1.4" stroke-linejoin="round"/><circle cx="7.5" cy="17" r="2.4" fill="${O}"/><circle cx="16.5" cy="17" r="2.4" fill="${O}"/>`,
  walk:`<ellipse cx="8" cy="15" rx="3.4" ry="5" fill="#FFB59E" stroke="${O}" stroke-width="1.8" transform="rotate(-12 8 15)"/><ellipse cx="16" cy="9" rx="3.4" ry="5" fill="#FFB59E" stroke="${O}" stroke-width="1.8" transform="rotate(12 16 9)"/>`,
  coin:`<circle cx="12" cy="12" r="9" fill="#FFE08A" stroke="${O}" stroke-width="2"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="#E8B84A" stroke-width="1.6"/><path d="M8.2 8.6 Q9.6 7 11.6 6.8" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
  bowl:`<path d="M3 11 H21 Q20.5 20 12 20 Q3.5 20 3 11Z" fill="#FFB59E" stroke="${O}" stroke-width="2" stroke-linejoin="round"/><path d="M8 7 Q7 5 8 3 M12 7 Q11 5 12 3 M16 7 Q15 5 16 3" stroke="#C9B8A8" stroke-width="1.6" fill="none" stroke-linecap="round"/>`,
  map:`<path d="M3 6 L8.5 4 L15.5 6 L21 4 V18 L15.5 20 L8.5 18 L3 20Z" fill="#fff" stroke="${O}" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 4 V18 M15.5 6 V20" stroke="${O}" stroke-width="1.6"/><circle cx="12" cy="11" r="2.2" fill="#F28C6E"/>`,
  refresh:`<path d="M19 12 A7 7 0 1 1 16.5 6.6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M17.5 2.5 V7.5 H12.5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
  heart:`<path d="M12 20 Q3 14 3 8.6 A4.6 4.6 0 0 1 12 6.8 A4.6 4.6 0 0 1 21 8.6 Q21 14 12 20Z" fill="#fff" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>`,

let history = store.get("lunch_hist",[]);
let mode = "random";
const F = Object.assign({region:"all",time:25,prices:[],cuisines:[],avoid:true}, store.get("lunch_filter",{}));

function allRestaurants(){
  return BASE.map(r=>({id:"b:"+r[0],name:r[0],area:r[1],cui:r[2],price:r[3],note:r[4],q:r[5]})).concat(custom);
}
/* 隨機模式：只套用「價位快速選單」；條件模式：全部條件 */
function candidates(){
  let list = allRestaurants().filter(r=>!F.prices.length || F.prices.includes(r.price));
  if(mode==="filter"){
    list = list.filter(r=>{
      const a=AREAS[r.area];
      if(F.region!=="all" && a.region!==F.region) return false;
      if(a.min > F.time) return false;
      if(F.cuisines.length && !F.cuisines.includes(r.cui)) return false;
      return true;
    });
    if(F.avoid){
      const recent=history.slice(0,3).map(h=>h.id);
      const f=list.filter(r=>!recent.includes(r.id)); if(f.length) list=f;
    }
  }
  return list;
}

/* ===== 畫面 ===== */
const $ = s=>document.querySelector(s);
function chip(g,k,label,on,color,icon=""){return `<button class="chip ${on?"on":""}" data-g="${g}" data-k="${k}" ${color?`data-c="${color}"`:""}>${icon}${label}</button>`;}
function renderFilters(){
  $("#fRegion").innerHTML = chip("region","all","全部",F.region==="all","sky")
    + Object.entries(REGIONS).map(([k,v])=>chip("region",k,v,F.region===k,"sky")).join("");
  $("#fTime").innerHTML = [5,10,15,25].map(m=>chip("time",m,m===25?"都可以":m+" 分內",F.time===m,"mint",ui(m<=5?"walk":"car",18))).join("");
  $("#fPrice").innerHTML = Object.entries(PRICES).map(([k,v])=>chip("price",k,v.q,F.prices.includes(k),"peach")).join("");
  $("#fCuisine").innerHTML = Object.entries(CUISINES).map(([k,v])=>chip("cui",k,v.name,F.cuisines.includes(k),"",foodSVG(k,22))).join("");
  $("#avoidSw").classList.toggle("on",F.avoid);
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const g=c.dataset.g,k=c.dataset.k;
  const wasOn=c.classList.contains("on");
  Snd.play((g==="price"||g==="cui")&&wasOn?"chipOff":"chipOn");
  if(g==="region") F.region=k;
  if(g==="time") F.time=+k;
  if(g==="price") F.prices=F.prices.includes(k)?F.prices.filter(x=>x!==k):[...F.prices,k];
  if(g==="cui") F.cuisines=F.cuisines.includes(k)?F.cuisines.filter(x=>x!==k):[...F.cuisines,k];
  store.set("lunch_filter",F); renderFilters(); refresh();
});
$("#avoidSw").onclick=()=>{F.avoid=!F.avoid;Snd.play("toggle",F.avoid);store.set("lunch_filter",F);renderFilters();refresh();};

  $("#list").innerHTML = list.length ? list.map(r=>`<div class="item"><div class="i-emo" style="background:${CUISINES[r.cui].bg}">${foodSVG(r.cui,36)}</div>

/* ===== 扭蛋球物理模擬 =====
   像 FW 的固定週期 task：每個 frame 跑一次 step()，
   重力 + 牆壁碰撞 + 球球碰撞；轉動時隨機把球往上踢（像中斷亂入），
   球的旋轉角度依貼著牆滾動的速度計算，看起來就像真的在裡面滾。 */
const GLOBE_R = 109, CAP_R = 23, CX = 109, CY = 109;
const START = [[48,186],[94,190],[140,188],[184,182],[60,146],[106,150],[152,146],[82,108],[128,108],[104,70],[40,104],[176,104]];
let balls = [], stirring = false;
function renderGlobe(){
  const g = $("#globe");
  g.innerHTML = START.map((_,i)=>`<div class="cap" style="--c:${CAP_COLORS[i%6]}"><i></i></div>`).join("") + `<div class="globe-shine"></div>`;
  const els = g.querySelectorAll(".cap");
  balls = START.map(([x,y],i)=>({x,y,vx:0,vy:0,a:Math.random()*6.28,av:0,el:els[i]}));
  for(let k=0;k<120;k++) step(); // 先讓球自然落定
  draw(); requestAnimationFrame(loop);
}
function step(){
  const G = .24, E = stirring ? .8 : .5;
  for(const b of balls){
    b.vy += G;
    if(stirring && Math.random()<.07){
      // 像真的扭蛋機：底下的球被隨機往上踢，亂跳亂撞
      const low = b.y > CY - 10;
      b.vy -= (low?4.5:2) + Math.random()*5;
      b.vx += (Math.random()-.5)*7;
      b.av += (Math.random()-.5)*.35;
    }
    b.vx *= .992; b.vy *= .992;
    const sp = Math.hypot(b.vx,b.vy); if(sp>11){b.vx*=11/sp;b.vy*=11/sp;}
    b.x += b.vx; b.y += b.vy;
    // 牆壁
    const dx=b.x-CX, dy=b.y-CY, d=Math.hypot(dx,dy), m=GLOBE_R-CAP_R;
    if(d>m){
      const nx=dx/d, ny=dy/d;
      b.x=CX+nx*m; b.y=CY+ny*m;
      const vn=b.vx*nx+b.vy*ny;
      if(vn>0){ if(vn>2.5 && stirring) Snd.clack(vn*.7); b.vx-=(1+E)*vn*nx; b.vy-=(1+E)*vn*ny;}
      const vt=b.vx*(-ny)+b.vy*nx;           // 沿牆切線速度
      b.av += (vt/CAP_R - b.av)*.35;          // 貼牆滾動 → 轉起來
      b.vx*=.985; b.vy*=.985;
    }
  }
  // 球球碰撞
  for(let i=0;i<balls.length;i++) for(let j=i+1;j<balls.length;j++){
    const p=balls[i], q=balls[j];
    let dx=q.x-p.x, dy=q.y-p.y, d=Math.hypot(dx,dy);
    const min=CAP_R*2; if(d>=min||d===0) continue;
    const nx=dx/d, ny=dy/d, ov=(min-d)/2;
    p.x-=nx*ov; p.y-=ny*ov; q.x+=nx*ov; q.y+=ny*ov;
    const rv=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;
    if(rv<-1.2 && stirring) Snd.clack(-rv);
    if(rv<0){const imp=-(1+.6)*rv/2; p.vx-=imp*nx;p.vy-=imp*ny;q.vx+=imp*nx;q.vy+=imp*ny;}
    // 摩擦帶動旋轉
    const vt=(q.vx-p.vx)*(-ny)+(q.vy-p.vy)*nx;
    p.av += vt/CAP_R*.06; q.av -= vt/CAP_R*.06;
  }
  for(const b of balls){ b.a += b.av; b.av *= .985; }
}
function draw(){
  for(const b of balls) b.el.style.transform=`translate(${(b.x-CAP_R).toFixed(1)}px,${(b.y-CAP_R).toFixed(1)}px) rotate(${b.a.toFixed(3)}rad)`;
}
function loop(){ step(); step(); draw(); requestAnimationFrame(loop); }

function refresh(){
  const n=candidates().length;
  $("#count").textContent = mode==="filter" ? `目前有 ${n} 間符合條件` : (F.prices.length?`這個預算有 ${n} 間店`:`扭蛋機裡有 ${n} 間店`);
  document.querySelector(".gacha").classList.toggle("empty",n===0);
  if(n===0 && !spinning) $("#ticker").textContent="沒有符合的店家，放寬條件試試";
  else if(!spinning && $("#ticker").textContent.startsWith("沒有符合")) $("#ticker").textContent="轉一下把手，命運幫你決定";
  renderList(); renderHist();
}

/* ======================================================
   音效 & 背景音樂（Web Audio 即時合成，不用音檔）
   像 FW 的 PWM 蜂鳴器：用振盪器 + 包絡線（ADSR）組出每個聲音
   ====================================================== */
const Snd = (()=>{
  let ctx=null, master=null, sfxBus=null, bgmBus=null, noiseBuf=null;
  let sfxOn = store.get("lunch_sfx",true), bgmOn = store.get("lunch_bgm",true);
  let bgmTimer=null, nextT=0, step16=0, lastClack=0;
  function init(){
    if(ctx) { if(ctx.state==="suspended") ctx.resume(); return true; }
    try{
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=.9;
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
      master.connect(comp); comp.connect(ctx.destination);
      sfxBus=ctx.createGain(); sfxBus.gain.value=sfxOn?1:0; sfxBus.connect(master);
      bgmBus=ctx.createGain(); bgmBus.gain.value=bgmOn?.55:0; bgmBus.connect(master);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*1.5,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      if(bgmOn) startBgm();
      return true;
    }catch(e){ ctx=null; return false; }
  }
  const now=()=>ctx.currentTime;
  // 基本音：頻率、長度、波形、音量、起始延遲、滑音目標
  function tone(f,dur,{type="sine",vol=.3,at=0,to=null,attack=.004,bus=null,q=null}={}){
    if(!ctx) return;
    const t=now()+at, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(bus||sfxBus); o.start(t); o.stop(t+dur+.05);
    return o;
  }
  function noise(dur,{vol=.3,at=0,type="bandpass",freq=2000,Q=1,to=null,bus=null}={}){
    if(!ctx) return;
    const t=now()+at, src=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=noiseBuf; f.type=type; f.frequency.setValueAtTime(freq,t); f.Q.value=Q;
    if(to) f.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(bus||sfxBus);
    src.start(t, Math.random()*.5); src.stop(t+dur+.02);
  }
  const N=n=>440*Math.pow(2,(n-69)/12); // MIDI → Hz

  /* ---------- 介面小音效 ---------- */
  const sfx = {
    pop(){ tone(520,.09,{type:"sine",vol:.28,to:880}); tone(1320,.05,{vol:.08,at:.01}); },
    tab(){ tone(660,.07,{vol:.22,to:990}); tone(990,.08,{vol:.12,at:.05}); },
    chipOn(){ tone(N(76),.08,{type:"triangle",vol:.25}); tone(N(83),.12,{type:"triangle",vol:.2,at:.06}); },
    chipOff(){ tone(N(79),.08,{type:"triangle",vol:.2}); tone(N(72),.12,{type:"triangle",vol:.16,at:.06}); },
    toggle(on){ on ? (tone(N(72),.08,{vol:.25}),tone(N(79),.14,{vol:.22,at:.07})) : (tone(N(79),.08,{vol:.2}),tone(N(67),.14,{vol:.18,at:.07})); },
    // 把手：咔咔咔（棘輪聲，越轉越慢）
    crank(){
      let t=0, gap=.045;
      for(let i=0;i<22;i++){
        noise(.025,{vol:.32,at:t,freq:2600+Math.random()*800,Q:6});
        tone(180+Math.random()*30,.03,{type:"square",vol:.06,at:t});
        t+=gap; gap*=1.075;
      }
      tone(140,.5,{type:"triangle",vol:.06,at:0,to:90}); // 機身低鳴
    },
    // 扭蛋互撞：塑膠喀喀聲（物理碰撞時呼叫，限制頻率）
    clack(power){
      if(!ctx||!sfxOn) return;
      const t=performance.now(); if(t-lastClack<32) return; lastClack=t;
      const v=Math.min(.22,.04+power*.03);
      noise(.03,{vol:v,freq:3000+Math.random()*2500,Q:9});
      tone(900+Math.random()*700,.035,{type:"triangle",vol:v*.5});
    },
    // 跑馬燈每換一個名字的滴答聲（音高慢慢往上）
    tick(i,total){ tone(N(72+Math.round(i/total*12)),.05,{type:"square",vol:.06}); tone(N(84+Math.round(i/total*12)),.04,{vol:.05,at:.005}); },
    // 扭蛋掉出來：咚～咚、咚（彈跳）
    drop(){
      [[0,.3],[.26,.18],[.42,.1],[.52,.05]].forEach(([at,v])=>{
        tone(220,.16,{type:"sine",vol:v,at,to:120});
        noise(.04,{vol:v*.6,at,freq:1800,Q:3});
      });
    },
    // 扭蛋打開：啵！＋閃亮亮
    open(){
      tone(380,.12,{type:"sine",vol:.35,to:1400});
      noise(.06,{vol:.2,freq:4000,Q:2});
      [N(88),N(91),N(96),N(100)].forEach((f,i)=>tone(f,.35,{type:"sine",vol:.08,at:.08+i*.05}));
    },
    // 結果出爐：可愛小號角
    fanfare(){
      const seq=[[67,0,.12],[72,.12,.12],[76,.24,.12],[79,.36,.34],[76,.62,.1],[79,.72,.42]];
      seq.forEach(([n,at,d])=>{ tone(N(n),d+.06,{type:"square",vol:.07,at}); tone(N(n+12),d,{type:"triangle",vol:.08,at}); });
      tone(N(48),.8,{type:"triangle",vol:.12,at:.36});
    },
    // 就吃這間！拉炮 + 鞭炮 + 歡呼
    party(){
      // 拉炮
      noise(.18,{vol:.5,type:"highpass",freq:900,Q:.7});
      tone(160,.15,{type:"sine",vol:.4,to:60});
      // 派對喇叭
      const h=tone(440,.5,{type:"sawtooth",vol:.07,at:.05,to:880});
      // 鞭炮劈哩啪啦
      for(let i=0;i<34;i++){
        const at=.15+Math.random()*1.3, v=.12+Math.random()*.22;
        noise(.02+Math.random()*.03,{vol:v,at,type:"highpass",freq:1200+Math.random()*2500,Q:1});
        if(Math.random()<.4) tone(1200+Math.random()*1800,.03,{type:"square",vol:.03,at});
      }
      // 歡呼「耶～」：多個聲部往上滑
      for(let k=0;k<7;k++){
        if(!ctx) break;
        const t=now()+.12+Math.random()*.1, o=ctx.createOscillator(), f=ctx.createBiquadFilter(), g=ctx.createGain(), lfo=ctx.createOscillator(), lg=ctx.createGain();
        const base=320+Math.random()*260;
        o.type="sawtooth"; o.frequency.setValueAtTime(base,t); o.frequency.linearRampToValueAtTime(base*1.35,t+.35); o.frequency.linearRampToValueAtTime(base*1.2,t+.9);
        lfo.frequency.value=5+Math.random()*2; lg.gain.value=base*.03; lfo.connect(lg); lg.connect(o.frequency);
        f.type="bandpass"; f.frequency.value=1100+Math.random()*500; f.Q.value=1.4;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.045,t+.08); g.gain.exponentialRampToValueAtTime(.0001,t+1);
        o.connect(f); f.connect(g); g.connect(sfxBus); o.start(t); lfo.start(t); o.stop(t+1.05); lfo.stop(t+1.05);
      }
      // 閃亮音收尾
      [84,88,91,96].forEach((n,i)=>tone(N(n),.5,{vol:.07,at:.5+i*.08}));
    },
    whoosh(){ noise(.3,{vol:.25,freq:400,to:3000,Q:1.2}); tone(300,.25,{vol:.06,to:700}); },
    close(){ tone(880,.14,{vol:.14,to:440}); },
    add(){ [72,76,79,84].forEach((n,i)=>tone(N(n),.16,{type:"triangle",vol:.16,at:i*.06})); },
    clear(){ [79,74,71,67].forEach((n,i)=>tone(N(n),.14,{type:"triangle",vol:.13,at:i*.06})); },
    chime(){ tone(N(88),.4,{vol:.1}); tone(N(93),.5,{vol:.08,at:.08}); },
  };

  /* ---------- 背景音樂：音樂盒風 8 小節循環 ---------- */
  const BPM=104, S16=60/BPM/4;
  // 每小節 8 個八分音符（0 = 休息）
  const MEL=[
    76,79,84,0, 79,76,81,79,
    84,0,83,81, 76,0,81,83,
    81,84,89,0, 84,81,79,77,
    79,83,86,0, 83,0,79,0,
    88,86,84,0, 79,76,79,84,
    81,0,79,76, 72,76,81,79,
    77,81,84,81, 79,77,76,74,
    74,79,83,86, 84,0,0,0 ];
  const CH=[[48,55,64],[45,52,60],[41,48,57],[43,50,59],[48,55,64],[45,52,60],[41,48,57],[43,50,59]];
  function musicBox(f,t,vol){
    const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o2.type="sine"; o.frequency.value=f; o2.frequency.value=f*4.01;
    const g2=ctx.createGain(); g2.gain.value=.12;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.9);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bgmBus);
    o.start(t); o2.start(t); o.stop(t+1); o2.stop(t+1);
  }
  function pluck(f,t,vol,d=.4){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type="triangle"; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(bgmBus); o.start(t); o.stop(t+d+.05);
  }
  function shaker(t,vol){
    const src=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=noiseBuf; f.type="highpass"; f.frequency.value=6000;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+.05);
    src.connect(f); f.connect(g); g.connect(bgmBus); src.start(t,Math.random()); src.stop(t+.06);
  }
  function schedule(){
    while(nextT < ctx.currentTime + .25){
      const bar=Math.floor(step16/16)%8, s=step16%16;
      if(s%2===0){ const n=MEL[bar*8+s/2]; if(n) musicBox(N(n),nextT,.11); }
      const ch=CH[bar];
      if(s===0) pluck(N(ch[0]-12),nextT,.16,.7);
      if(s===8) pluck(N(ch[0]-5),nextT,.12,.5);
      if(s===4||s===12){ pluck(N(ch[1]),nextT,.05,.25); pluck(N(ch[2]),nextT,.05,.25); }
      if(s%4===2) shaker(nextT,.035);
      nextT+=S16; step16++;
    }
  }
  function startBgm(){ if(!ctx||bgmTimer) return; nextT=ctx.currentTime+.1; bgmTimer=setInterval(schedule,60); }
  function stopBgm(){ clearInterval(bgmTimer); bgmTimer=null; }

  return {
    init,
    play(name,...a){ if(!sfxOn) return; if(!init()) return; sfx[name]&&sfx[name](...a); },
    clack(p){ if(ctx) sfx.clack(p); },
    get sfxOn(){return sfxOn}, get bgmOn(){return bgmOn},
    setSfx(v){ sfxOn=v; store.set("lunch_sfx",v); if(sfxBus) sfxBus.gain.value=v?1:0; },
    setBgm(v){ bgmOn=v; store.set("lunch_bgm",v); if(!init()) return;
      bgmBus.gain.setTargetAtTime(v?.55:0,ctx.currentTime,.1); v?startBgm():setTimeout(()=>{if(!bgmOn)stopBgm()},400); },
  };
})();

  $("#filterCard").classList.toggle("hidden",t!=="filter");

$("#toggleList").onclick=()=>{Snd.play("pop");const l=$("#list");l.classList.toggle("hidden");$("#toggleList").textContent=l.classList.contains("hidden")?"展開":"收起";};

/* ===== 轉扭蛋 ===== */
let current=null, spinning=false, handleDeg=0;
function spin(){
  const list=candidates(); if(!list.length||spinning) return;
  spinning=true; document.querySelector(".gacha").classList.add("busy");
  const out=$("#outcap"); out.classList.remove("drop"); out.style.opacity=0;
  stirring=true; $("#mbody").classList.add("shake");
  Snd.play("crank");
  handleDeg+=720; $("#handle").style.transform=`rotate(${handleDeg}deg)`;
  let pick=list[Math.floor(Math.random()*list.length)];
  if(list.length>1 && current && pick.id===current.id){const o=list.filter(r=>r.id!==current.id);pick=o[Math.floor(Math.random()*o.length)];}
  let n=0; const total=18;
  const tick=()=>{
    const r = n<total-1 ? list[Math.floor(Math.random()*list.length)] : pick;
    $("#ticker").innerHTML = foodSVG(r.cui,26)+esc(r.name);
    Snd.play("tick",n,total);
    n++;
    if(n<total) setTimeout(tick,45+n*n*1.5);
    else {
      stirring=false; $("#mbody").classList.remove("shake");
      const col=CAP_COLORS[Math.floor(Math.random()*6)];
      out.style.setProperty("--c",col); void out.offsetWidth; out.classList.add("drop"); Snd.play("drop");
      setTimeout(()=>{spinning=false;document.querySelector(".gacha").classList.remove("busy");showResult(pick,col);},950);
    }
  };
  tick();
}
$("#handle").onclick=spin;
$("#handle").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();spin();}};


/* ===== Q 版小地圖（示意圖，不是真的地圖）===== */
const RIVER = [[121.08,24.785],[121.05,24.793],[121.03,24.799],[121.005,24.806],[120.985,24.813],[120.965,24.821],[120.94,24.832]];
function miniMap(r){
  const a = AREAS[r.area], W=320, H=168;
  // 取出發點與目的地的範圍，最少 1.8km，等比例縮放
  const cLat=(ORIGIN.lat+a.lat)/2, cLng=(ORIGIN.lng+a.lng)/2;
  const spanX=Math.max(Math.abs(a.lng-ORIGIN.lng)*101, 1.8), spanY=Math.max(Math.abs(a.lat-ORIGIN.lat)*110.9, 1.0);
  const k=Math.min((W-90)/spanX,(H-70)/spanY);           // px per km
  const P=(lat,lng)=>[W/2+(lng-cLng)*101*k + 18, H/2-(lat-cLat)*110.9*k + 8];
  const [sx,sy]=P(ORIGIN.lat,ORIGIN.lng), [dx,dy]=P(a.lat,a.lng);
  // 路線：一條彎彎的虛線
  const mx=(sx+dx)/2, my=(sy+dy)/2, len=Math.hypot(dx-sx,dy-sy)||1;
  const cx=mx+(-(dy-sy)/len)*len*.22, cy=my+((dx-sx)/len)*len*.22;
  const route=`M${sx.toFixed(1)} ${sy.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${dx.toFixed(1)} ${dy.toFixed(1)}`;
  const river=RIVER.map(([lng,lat],i)=>{const [x,y]=P(lat,lng);return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}).join(" ");
  // 小裝飾：樹和房子（固定亂數，每間店長得一樣）
  let seed=[...r.name].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7); const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
  let deco="";
  for(let i=0;i<9;i++){
    const x=20+rnd()*(W-40), y=20+rnd()*(H-36);
    if(Math.hypot(x-dx,y-dy)<34||Math.hypot(x-sx,y-sy)<22||(x<120&&y<56)) continue;
    deco += rnd()<.6
      ? `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><rect x="-1.5" y="2" width="3" height="6" fill="#B97A4E"/><circle r="7" fill="#9ED7A8" stroke="${O}" stroke-width="2"/></g>`
      : `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><path d="M-8 0 L0 -8 L8 0Z" fill="#FF9C86" stroke="${O}" stroke-width="2" stroke-linejoin="round"/><rect x="-6" y="0" width="12" height="9" fill="#fff" stroke="${O}" stroke-width="2"/></g>`;
  }
  const label=(t,lat,lng)=>{const [x,y]=P(lat,lng);return `<text x="${x.toFixed(0)}" y="${y.toFixed(0)}" font-size="15" font-weight="900" fill="#5A4434" opacity=".16" text-anchor="middle" font-family="Zen Maru Gothic, PingFang TC, sans-serif">${t}</text>`;};
  const pill=(t,x,y)=>{const w=t.length*15+18;x=Math.min(Math.max(x,w/2+6),W-w/2-6);y=Math.min(Math.max(y,14),H-14);
    return `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><rect x="${-w/2}" y="-12" width="${w}" height="24" rx="12" fill="#fff" stroke="${O}" stroke-width="2.5"/><text y="5.5" font-size="14" font-weight="900" fill="${O}" text-anchor="middle" font-family="Zen Maru Gothic, PingFang TC, sans-serif">${t}</text></g>`;};
  const cross = a.region!=="zb";
  const tags = cross ? (Math.abs(dx-sx)<70 ? pill("竹北",sx+42,sy) : pill("竹北",sx+(sx<dx?-8:8),sy+(sy<dy?-22:22))) + pill(REGIONS[a.region],dx+(dx<sx?-34:34),dy+10) : "";
  const near = a.walk<=8;
  const head = near ? `${ui("walk",20)}走路約 ${a.walk} 分` : `${ui("car",20)}開車約 ${a.min} 分`;
  const subTxt = near ? `約 ${a.road.toFixed(1)} 公里・開車約 ${a.min} 分` : `約 ${a.road.toFixed(1)} 公里${a.walk<=15?`・走路約 ${a.walk} 分`:""}`;
  return `<div class="mini">
    <svg viewBox="0 0 ${W} ${H}">
      <defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#E2EFD6" stroke-width="2"/></pattern></defs>
      <rect width="${W}" height="${H}" fill="url(#grid)"/>
      <path d="${river}" fill="none" stroke="#BFDDF7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${river}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 10" opacity=".8"/>
      ${deco}
      <path d="${route}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      <path d="${route}" fill="none" stroke="#F28C6E" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"><animate attributeName="stroke-dashoffset" from="22" to="0" dur=".8s" repeatCount="indefinite"/></path>
      <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="6" fill="#fff" stroke="${O}" stroke-width="3"/>
      <g><svg x="-13" y="-13" width="26" height="26" viewBox="0 0 24 24" overflow="visible">${UI.car}</svg>
        <animateMotion dur="2.6s" repeatCount="indefinite" path="${route}" keyTimes="0;1" keySplines=".4 0 .6 1" calcMode="spline"/></g>
      ${tags}
      <g transform="translate(${dx.toFixed(1)} ${dy.toFixed(1)})">
        <ellipse cx="0" cy="2" rx="10" ry="4" fill="#5A4434" opacity=".18"/>
        <path d="M0 0 Q-17 -20 -17 -32 A17 17 0 0 1 17 -32 Q17 -20 0 0Z" fill="#FFB59E" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="0" cy="-32" r="12" fill="#fff" stroke="${O}" stroke-width="2"/>
        <svg x="-11" y="-43" width="22" height="22" viewBox="0 0 64 64">${FOOD[r.cui]}</svg>
        <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -4;0 0" dur="1.4s" repeatCount="indefinite"/>
      </g>
    </svg>
    <div class="eta"><b>${head}</b><span>${subTxt}</span></div>
  </div>`;
}

function showResult(r,col){
  current=r; col=col||CAP_COLORS[Math.floor(Math.random()*6)];
  const a=AREAS[r.area], c=CUISINES[r.cui];
  const hints=["今天就決定是你了！","命運的午餐是…","轉到這間！衝啊","肚子說：就這間"];
  $("#result").innerHTML = `
    <div class="reveal" style="--c:${col}">
      <div class="food">${foodSVG(r.cui,92)}</div>
      <div class="half top"></div><div class="half bot"></div>
    </div>
    <div class="r-hint">${hints[Math.floor(Math.random()*hints.length)]}</div>
    <div class="r-name">${esc(r.name)}</div>
    ${miniMap(r)}
    <div class="tags">
      <span class="tag t1">${ui(a.min<=5?"walk":"car",16)}約 ${a.min} 分</span>
      <span class="tag t2">${ui("coin",16)}TWD ${PRICES[r.price].name}</span>
      <span class="tag t3">${foodSVG(r.cui,18)}${c.name}</span>
      <span class="tag t4">${ui("pin",16)}${a.name}</span>
    </div>
    <p class="r-note">${esc(r.note||"")}</p>
    <div class="r-actions">
      <a class="btn map" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.q||r.name+" "+REGIONS[a.region])}" target="_blank" rel="noopener">${ui("map",20)}用 Google 地圖導航</a>
      <button class="btn again" id="againBtn">${ui("refresh",18)}換一間</button>
      <button class="btn go" id="goBtn">${ui("heart",18,1)}就吃這間！</button>
    </div>`;
  $("#overlay").classList.add("show");
  Snd.play("open"); setTimeout(()=>Snd.play("fanfare"),380);
  $("#againBtn").onclick=()=>{Snd.play("whoosh");closeResult(true);setTimeout(spin,250);};
  const mapA=$("#result .btn.map"); if(mapA) mapA.addEventListener("click",()=>Snd.play("pop"));
  $("#goBtn").onclick=()=>{
    history.unshift({id:r.id,t:Date.now()}); history=history.slice(0,30);
    store.set("lunch_hist",history); Snd.play("party"); confetti(); toast("祝你吃得開心！");
    closeResult(true); refresh();
  };
}
function closeResult(silent){ if(!silent && $("#overlay").classList.contains("show")) Snd.play("close"); $("#overlay").classList.remove("show");const o=$("#outcap");o.classList.remove("drop");o.style.opacity=0;}
$("#overlay").onclick=e=>{if(e.target.id==="overlay") closeResult();};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-pick]"); if(!b) return;
  const r=allRestaurants().find(x=>x.id===b.dataset.pick); if(r){ Snd.play("pop"); showResult(r); }
});

function confetti(){
  const shapes=[ui("star",22),ui("spark",20),`<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#FFB59E" stroke="${O}" stroke-width="2"/></svg>`,`<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#BFE6D6" stroke="${O}" stroke-width="2"/></svg>`];
  for(let i=0;i<20;i++){
    const s=document.createElement("div"); s.className="confetti"; s.innerHTML=shapes[i%shapes.length];
    s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(1.4+Math.random()*1.2)+"s"; s.style.animationDelay=(Math.random()*.3)+"s";
    document.body.appendChild(s); setTimeout(()=>s.remove(),3200);
  }
}
let tt; function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

  store.set("lunch_custom",custom); $("#aName").value=""; Snd.play("add"); toast("加進扭蛋機了！"); refresh();
};
$("#clearHist").onclick=()=>{Snd.play("clear");history=[];store.set("lunch_hist",history);refresh();};
