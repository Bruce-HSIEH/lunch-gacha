<title>台元午餐轉轉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6EA; --card:#FFFFFF; --ink:#5A4434; --ink2:#9A8574;
  --peach:#FFB59E; --peach-d:#F28C6E; --red:#FF8F78; --mint:#BFE6D6; --mint-d:#5DB596;
  --butter:#FFE08A; --lav:#D9CCF5; --sky:#BFDDF7; --pink:#FFD1DC; --line:#F0E2D2;
  --shadow:0 6px 0 #EBD8C3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","PingFang TC","Heiti TC","Noto Sans TC",system-ui,sans-serif;}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px);
  background-image:radial-gradient(#F6E6D3 1.2px,transparent 1.2px);background-size:18px 18px;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto}
button{font-family:inherit;color:inherit;cursor:pointer}
svg.ic{display:inline-block;vertical-align:middle;flex:none}

/* header */
header{display:flex;align-items:center;gap:12px;margin:4px 0 14px}

.mascotBtn{position:relative;border:0;background:none;padding:0;flex:none;cursor:pointer;touch-action:manipulation}
.mascot{width:66px;height:66px;display:block;animation:bob 2.4s ease-in-out infinite;overflow:visible}
.mascot #mBody{transform-origin:50% 92%;transform-box:view-box}
.mascot.poke #mBody{animation:squish .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes squish{0%{transform:scale(1.18,.78)}40%{transform:scale(.9,1.12)}70%{transform:scale(1.04,.97)}100%{transform:none}}
.mascot.angry{animation:rage .12s linear infinite}
@keyframes rage{25%{transform:translateX(-2px) rotate(-3deg)}75%{transform:translateX(2px) rotate(3deg)}}
.mascot.full #mBody{animation:pat 1.2s ease-in-out infinite}
@keyframes pat{50%{transform:scale(1.06,.96)}}
.mascot.hungry #mBody{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.mascot.love #mBody{animation:pat .7s ease-in-out infinite}
.mBubble{position:absolute;left:58px;top:-6px;z-index:8;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:900;white-space:nowrap;
  opacity:0;transform:scale(.4) translateY(6px);transform-origin:left bottom;transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1);pointer-events:none;box-shadow:0 3px 0 rgba(90,68,52,.18)}
.mBubble::before{content:"";position:absolute;left:-5.5px;bottom:6px;border:6px solid transparent;border-right-color:var(--ink)}
.mBubble.show{opacity:1;transform:none}
.mBubble.angry{background:#FFD6D6}
.mBubble.hungry{background:#FFF1B8}
.mBubble.full{background:#D9F2E3}
.mBubble.love{background:#FFE3EC}

@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.snd{margin-left:auto;display:flex;gap:6px;align-self:flex-start;margin-top:4px}
.snd button{width:40px;height:40px;border-radius:14px;border:2.5px solid var(--line);background:#fff;display:grid;place-items:center;padding:0;transition:.15s}
.snd button.off{opacity:.45;background:#F6E7D6}
.snd button:active{transform:scale(.9)}
h1{font-size:20px;white-space:nowrap;margin:0;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.sub{font-size:13px;color:var(--ink2);margin-top:3px}

/* tabs */
.tabs{display:flex;background:#F6E7D6;border-radius:999px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 0;border-radius:999px;font-size:15px;font-weight:700;color:var(--ink2);transition:.2s;display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 #E6D2BC}

.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);border:2px solid var(--line);margin-bottom:16px}

/* ===== 扭蛋機 ===== */
.stage{text-align:center;padding:14px 10px 18px}
.gacha{position:relative;width:250px;margin:0 auto}
.lid{width:64px;height:30px;margin:0 auto -10px;background:var(--red);border:4px solid var(--ink);border-radius:34px 34px 8px 8px;position:relative;z-index:2}
.lid::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--butter);border:3px solid var(--ink);left:50%;top:-14px;transform:translateX(-50%)}
.globe{width:226px;height:226px;margin:0 auto;border-radius:50%;border:4px solid var(--ink);position:relative;overflow:hidden;z-index:1;
  background:radial-gradient(circle at 35% 30%,#FFFFFF 0%,#EEF7FD 55%,#DCEEFA 100%)}
.cap{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);will-change:transform;
  background:linear-gradient(to bottom,var(--c) 0 50%,#FFFDF8 50% 100%)}
.cap::after{content:"";position:absolute;left:-3px;right:-3px;top:calc(50% - 1.5px);height:3px;background:var(--ink);opacity:.55}
.cap i{position:absolute;left:9px;top:7px;width:8px;height:5px;border-radius:50%;background:rgba(255,255,255,.9)}
.collar{width:150px;height:24px;margin:-16px auto 0;background:var(--butter);border:4px solid var(--ink);border-radius:12px;position:relative;z-index:3}
.body{width:244px;height:168px;margin:-4px auto 0;background:var(--red);border:4px solid var(--ink);border-radius:26px 26px 34px 34px;position:relative;z-index:2;
  box-shadow:inset 0 -12px 0 rgba(0,0,0,.07)}
.body.shake{animation:jiggle .14s linear infinite}
@keyframes jiggle{25%{transform:translateX(-2px) rotate(-.8deg)}75%{transform:translateX(2px) rotate(.8deg)}}
.sign{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#FFF6EA;border:3px solid var(--ink);border-radius:999px;padding:3px 14px;font-size:13.5px;font-weight:900;white-space:nowrap;display:flex;align-items:center;gap:4px}
.coin{position:absolute;right:30px;top:56px;width:40px;height:20px;background:#FFF6EA;border:3px solid var(--ink);border-radius:8px}
.coin::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:4px;border-radius:4px;background:var(--ink);transform:translate(-50%,-50%)}
.handle{position:absolute;right:22px;bottom:18px;width:60px;height:60px;border-radius:50%;background:var(--butter);border:4px solid var(--ink);transition:transform 1.6s cubic-bezier(.3,.1,.2,1)}
.handle::before{content:"";position:absolute;left:50%;top:50%;width:46px;height:14px;border-radius:8px;background:#fff;border:3px solid var(--ink);transform:translate(-50%,-50%)}
.handle::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:var(--red);border:3px solid var(--ink);transform:translate(-50%,-50%)}

.handle{cursor:pointer}
.halo{position:absolute;right:22px;bottom:18px;width:60px;height:60px;border-radius:50%;background:rgba(255,224,138,.85);animation:halo 1.6s ease-out infinite;will-change:transform,opacity;pointer-events:none}
@keyframes halo{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.45);opacity:0}}
.gacha.busy .halo,.gacha.empty .halo{animation:none;opacity:0}
.handle:active{filter:brightness(.95)}

.callout{position:absolute;right:-50px;bottom:66px;z-index:6;pointer-events:none;animation:hop 1s ease-in-out infinite;transform-origin:left bottom}

.ticker{height:28px;margin-top:14px;font-weight:700;font-size:16.5px;color:var(--ink2);overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px}

.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:20px;padding:15px;font-size:19px;font-weight:900;

@keyframes popTop{to{transform:translate(-62px,-14px) rotate(-38deg);opacity:0}}

.btn.go{background:var(--peach-d);color:#fff;box-shadow:0 4px 0 #D9714F}
.btn.again{background:#F6E7D6}
.confetti{position:fixed;top:-30px;z-index:30;pointer-events:none;animation:fall linear forwards}

/* list */
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

footer{text-align:center;font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:6px}

/* ===== 開機畫面（固定淺色：iOS 深色模式啟動會閃一格白，WebKit bug 311569）===== */
#splash{position:fixed;inset:0;z-index:200;overflow:hidden;pointer-events:none}
#splash .sp-bg{position:absolute;inset:0;background:linear-gradient(170deg,#FFF6EA 0%,#FFF1E3 55%,#FFE9DA 100%);transition:opacity .55s ease}
#splash .sp-stage{position:absolute;left:50%;top:20%;width:250px;margin-left:-125px}

@keyframes spPop{0%{opacity:0;scale:.55;translate:0 30px}100%{opacity:1;scale:1;translate:0 0}}
#splash .sp-stage .cap{opacity:0}
#splash.sp-live .sp-stage .cap{animation:spCap .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.35s + var(--i) * 70ms)}
@keyframes spCap{0%{opacity:0;scale:.2}100%{opacity:1;scale:1}}
#splash.sp-live .sp-stage .handle{animation:spCrank 1.1s cubic-bezier(.3,.1,.2,1) 1.2s both}
@keyframes spCrank{to{rotate:720deg}}
#splash .sp-title{position:absolute;left:0;right:0;top:calc(20% + 462px);text-align:center;font-size:30px;font-weight:900;letter-spacing:.75px;color:var(--ink);white-space:nowrap;transform-origin:0 0}
#splash .sp-title span{display:inline-block;opacity:0}
#splash.sp-live .sp-title span{animation:spLetter .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.5s + var(--i) * 80ms)}
@keyframes spLetter{0%{opacity:0;translate:0 14px;scale:.6}100%{opacity:1;translate:0 0;scale:1}}
#splash .sp-tag{position:absolute;left:0;right:0;top:calc(20% + 508px);text-align:center;font-size:15px;font-weight:700;color:var(--ink2);opacity:0}
#splash.sp-live .sp-tag{animation:spTag .6s ease 1.3s both}
@keyframes spTag{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
#splash.sp-exit .sp-bg,#splash.sp-exit .sp-tag{opacity:0!important;transition:opacity .5s ease}
#splash.sp-exit .sp-tag{animation:none}
#splash.sp-fade{opacity:0;transition:opacity .5s ease}
@media (max-height:760px){#splash .sp-stage{top:9%}#splash .sp-title{top:calc(9% + 462px)}#splash .sp-tag{top:calc(9% + 508px)}}
/* 開機中：真的扭蛋機和標題先藏起來，等飛過來的那份抵達再出現；其他卡片浮上來 */
body.sp-flying #machineCard .gacha,body.sp-flying header h1{visibility:hidden}
body.booting .tabs,body.booting .card,body.booting footer,body.booting .snd,body.booting .mascotBtn,body.booting .sub{opacity:0}
body.enter .tabs,body.enter .card,body.enter footer,body.enter .snd,body.enter .mascotBtn,body.enter .sub{animation:enterUp .55s cubic-bezier(.2,.9,.3,1) both}
body.enter .mascotBtn{animation-delay:.05s}body.enter .sub{animation-delay:.1s}body.enter .tabs{animation-delay:.12s}
body.enter #machineCard{animation-delay:.18s}body.enter #listCard{animation-delay:.26s}body.enter footer{animation-delay:.32s}
@keyframes enterUp{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
body.enter #machineCard{animation-name:enterFade}

@media (prefers-reduced-motion:reduce){#splash *{animation:none!important;opacity:1!important}}
</style>

function allRestaurants(){
  return BASE.map(r=>({id:"b:"+r[0],name:r[0],area:r[1],cui:r[2],price:r[3],note:r[4],q:r[5],dish:r[6]})).concat(custom);

/* 隨機模式：套用「區域」＋「價位快速選單」；條件模式：全部條件
   區域預設竹北，新竹要到「條件」選新竹或全部才會加入 */
function candidates(){
  let list = allRestaurants().filter(r=>(!F.prices.length || F.prices.includes(r.price)) && (F.region==="all" || AREAS[r.area].region===F.region));
  if(mode==="filter"){
    list = list.filter(r=>{
      const a=AREAS[r.area];
      if(a.min > F.time) return false;
      if(F.cuisines.length && !F.cuisines.includes(r.cui)) return false;
      return true;
    });
    if(F.avoid){
      const recent=history.slice(0,3).map(h=>h.id);
      const f=list.filter(r=>!recent.includes(r.id)); if(f.length) list=f;
    }
  }
  return list;
}

/* ===== 扭蛋球物理模擬 =====
   像 FW 的固定週期 task：每個 frame 跑一次 step()，
   重力 + 牆壁碰撞 + 球球碰撞；轉動時隨機把球往上踢（像中斷亂入），
   球的旋轉角度依貼著牆滾動的速度計算，看起來就像真的在裡面滾。 */
const GLOBE_R = 109, CAP_R = 23, CX = 109, CY = 109;
const START = [[48,186],[94,190],[140,188],[184,182],[60,146],[106,150],[152,146],[82,108],[128,108],[104,70],[40,104],[176,104]];
let balls = [], stirring = false;
function renderGlobe(){
  const g = $("#globe");
  g.innerHTML = START.map((_,i)=>`<div class="cap" style="--c:${CAP_COLORS[i%6]}"><i></i></div>`).join("") ;
  const els = g.querySelectorAll(".cap");
  balls = START.map(([x,y],i)=>({x,y,vx:0,vy:0,a:Math.random()*6.28,av:0,el:els[i]}));
  for(let k=0;k<120;k++) step(); // 先讓球自然落定
  draw(); requestAnimationFrame(loop);
}
function step(){
  const G = .24, E = stirring ? .8 : .5;
  for(const b of balls){
    b.vy += G;
    if(stirring && Math.random()<.07){
      // 像真的扭蛋機：底下的球被隨機往上踢，亂跳亂撞
      const low = b.y > CY - 10;
      b.vy -= (low?4.5:2) + Math.random()*5;
      b.vx += (Math.random()-.5)*7;
      b.av += (Math.random()-.5)*.35;
    }
    b.vx *= .992; b.vy *= .992;
    const sp = Math.hypot(b.vx,b.vy); if(sp>11){b.vx*=11/sp;b.vy*=11/sp;}
    b.x += b.vx; b.y += b.vy;
    // 牆壁
    const dx=b.x-CX, dy=b.y-CY, d=Math.hypot(dx,dy), m=GLOBE_R-CAP_R;
    if(d>m){
      const nx=dx/d, ny=dy/d;
      b.x=CX+nx*m; b.y=CY+ny*m;
      const vn=b.vx*nx+b.vy*ny;
      if(vn>0){ if(vn>2.5 && stirring) Snd.clack(vn*.7); b.vx-=(1+E)*vn*nx; b.vy-=(1+E)*vn*ny;}
      const vt=b.vx*(-ny)+b.vy*nx;           // 沿牆切線速度
      b.av += (vt/CAP_R - b.av)*.35;          // 貼牆滾動 → 轉起來
      b.vx*=.985; b.vy*=.985;
    }
  }
  // 球球碰撞
  for(let i=0;i<balls.length;i++) for(let j=i+1;j<balls.length;j++){
    const p=balls[i], q=balls[j];
    let dx=q.x-p.x, dy=q.y-p.y, d=Math.hypot(dx,dy);
    const min=CAP_R*2; if(d>=min||d===0) continue;
    const nx=dx/d, ny=dy/d, ov=(min-d)/2;
    p.x-=nx*ov; p.y-=ny*ov; q.x+=nx*ov; q.y+=ny*ov;
    const rv=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;
    if(rv<-1.2 && stirring) Snd.clack(-rv);
    if(rv<0){const imp=-(1+.6)*rv/2; p.vx-=imp*nx;p.vy-=imp*ny;q.vx+=imp*nx;q.vy+=imp*ny;}
    // 摩擦帶動旋轉
    const vt=(q.vx-p.vx)*(-ny)+(q.vy-p.vy)*nx;
    p.av += vt/CAP_R*.06; q.av -= vt/CAP_R*.06;
  }
  for(const b of balls){ b.a += b.av; b.av *= .985; }
}
function draw(){
  for(const b of balls) b.el.style.transform=`translate(${(b.x-CAP_R).toFixed(1)}px,${(b.y-CAP_R).toFixed(1)}px) rotate(${b.a.toFixed(3)}rad)`;
}
let calm=0;
function loop(){
  // 球停下來就「睡覺」不再每格重算（像 MCU 沒事就進 sleep 省電），轉的時候再喚醒
  if(stirring) calm=0;
  if(calm<40 && (stirring || !document.body.classList.contains("modal"))){
    step(); step(); draw();
    const mv=balls.reduce((m,b)=>Math.max(m,Math.abs(b.vx)+Math.abs(b.vy)+Math.abs(b.av)*10),0);
    calm = (!stirring && mv<.08) ? calm+1 : 0;
  }
  requestAnimationFrame(loop);
}

function refresh(){
  const n=candidates().length;
  $("#count").textContent = mode==="filter" ? `目前有 ${n} 間符合條件` : (F.prices.length?`這個預算有 ${n} 間店`:`扭蛋機裡有 ${n} 間店`);
  document.querySelector(".gacha").classList.toggle("empty",n===0);
  if(n===0 && !spinning) $("#ticker").textContent="沒有符合的店家，放寬條件試試";
  else if(!spinning && $("#ticker").textContent.startsWith("沒有符合")) $("#ticker").textContent="轉一下把手，命運幫你決定";
  renderList(); renderHist();
}

/* ======================================================
   音效 & 背景音樂（Web Audio 即時合成，不用音檔）
   像 FW 的 PWM 蜂鳴器：用振盪器 + 包絡線（ADSR）組出每個聲音
   ====================================================== */
const Snd = (()=>{
  let ctx=null, master=null, sfxBus=null, bgmBus=null, noiseBuf=null;
  let sfxOn = store.get("lunch_sfx",true), bgmOn = store.get("lunch_bgm",true);
  let lastClack=0;
  function init(){
    if(bgmOn && !bgmPlaying) startBgm();   // <audio> 要在點擊當下 play()
    if(ctx) { if(ctx.state!=="running" && !document.hidden) ctx.resume(); return true; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext; try{ ctx=new AC({latencyHint:"playback"}); }catch(e){ ctx=new AC(); }
      master=ctx.createGain(); master.gain.value=.9;
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
      master.connect(comp); comp.connect(ctx.destination);
      sfxBus=ctx.createGain(); sfxBus.gain.value=sfxOn?1:0; sfxBus.connect(master);
      bgmBus=ctx.createGain(); bgmBus.gain.value=0; bgmBus.connect(master);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*1.5,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      return true;
    }catch(e){ ctx=null; return false; }
  }
  const now=()=>ctx.currentTime;
  // 基本音：頻率、長度、波形、音量、起始延遲、滑音目標
  function tone(f,dur,{type="sine",vol=.3,at=0,to=null,attack=.004,bus=null,q=null}={}){
    if(!ctx) return;
    const t=now()+at, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(bus||sfxBus); o.start(t); o.stop(t+dur+.05);
    return o;
  }
  function noise(dur,{vol=.3,at=0,type="bandpass",freq=2000,Q=1,to=null,bus=null}={}){
    if(!ctx) return;
    const t=now()+at, src=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=noiseBuf; f.type=type; f.frequency.setValueAtTime(freq,t); f.Q.value=Q;
    if(to) f.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(bus||sfxBus);
    src.start(t, Math.random()*.5); src.stop(t+dur+.02);
  }
  const N=n=>440*Math.pow(2,(n-69)/12); // MIDI → Hz

  /* ---------- 介面小音效 ---------- */
  const sfx = {
    pop(){ tone(520,.09,{type:"sine",vol:.28,to:880}); tone(1320,.05,{vol:.08,at:.01}); },
    tab(){ tone(660,.07,{vol:.22,to:990}); tone(990,.08,{vol:.12,at:.05}); },
    chipOn(){ tone(N(76),.08,{type:"triangle",vol:.25}); tone(N(83),.12,{type:"triangle",vol:.2,at:.06}); },
    chipOff(){ tone(N(79),.08,{type:"triangle",vol:.2}); tone(N(72),.12,{type:"triangle",vol:.16,at:.06}); },
    toggle(on){ on ? (tone(N(72),.08,{vol:.25}),tone(N(79),.14,{vol:.22,at:.07})) : (tone(N(79),.08,{vol:.2}),tone(N(67),.14,{vol:.18,at:.07})); },
    // 把手：咔咔咔（棘輪聲，越轉越慢）
    crank(){
      let t=0, gap=.045;
      for(let i=0;i<22;i++){
        noise(.025,{vol:.32,at:t,freq:2600+Math.random()*800,Q:6});
        tone(180+Math.random()*30,.03,{type:"square",vol:.06,at:t});
        t+=gap; gap*=1.075;
      }
      tone(140,.5,{type:"triangle",vol:.06,at:0,to:90}); // 機身低鳴
    },
    // 扭蛋互撞：塑膠喀喀聲（物理碰撞時呼叫，限制頻率）
    clack(power){
      if(!ctx||!sfxOn) return;
      const t=performance.now(); if(t-lastClack<70) return; lastClack=t;
      const v=Math.min(.22,.04+power*.03);
      noise(.03,{vol:v,freq:3000+Math.random()*2500,Q:9});
      tone(900+Math.random()*700,.035,{type:"triangle",vol:v*.5});
    },
    // 跑馬燈每換一個名字的滴答聲（音高慢慢往上）
    tick(i,total){ tone(N(72+Math.round(i/total*12)),.05,{type:"square",vol:.06}); tone(N(84+Math.round(i/total*12)),.04,{vol:.05,at:.005}); },
    // 扭蛋掉出來：咚～咚、咚（彈跳）
    drop(){
      [[0,.3],[.26,.18],[.42,.1],[.52,.05]].forEach(([at,v])=>{
        tone(220,.16,{type:"sine",vol:v,at,to:120});
        noise(.04,{vol:v*.6,at,freq:1800,Q:3});
      });
    },
    // 扭蛋打開：啵！＋閃亮亮
    open(){
      tone(380,.12,{type:"sine",vol:.35,to:1400});
      noise(.06,{vol:.2,freq:4000,Q:2});
      [N(88),N(91),N(96),N(100)].forEach((f,i)=>tone(f,.35,{type:"sine",vol:.08,at:.08+i*.05}));
    },
    // 結果出爐：可愛小號角
    fanfare(){
      const seq=[[67,0,.12],[72,.12,.12],[76,.24,.12],[79,.36,.34],[76,.62,.1],[79,.72,.42]];
      seq.forEach(([n,at,d])=>{ tone(N(n),d+.06,{type:"square",vol:.07,at}); tone(N(n+12),d,{type:"triangle",vol:.08,at}); });
      tone(N(48),.8,{type:"triangle",vol:.12,at:.36});
    },
    // 就吃這間！拉炮 + 鞭炮 + 歡呼
    party(){
      // 拉炮
      noise(.18,{vol:.5,type:"highpass",freq:900,Q:.7});
      tone(160,.15,{type:"sine",vol:.4,to:60});
      // 派對喇叭
      const h=tone(440,.5,{type:"sawtooth",vol:.07,at:.05,to:880});
      // 鞭炮劈哩啪啦
      for(let i=0;i<34;i++){
        const at=.15+Math.random()*1.3, v=.12+Math.random()*.22;
        noise(.02+Math.random()*.03,{vol:v,at,type:"highpass",freq:1200+Math.random()*2500,Q:1});
        if(Math.random()<.4) tone(1200+Math.random()*1800,.03,{type:"square",vol:.03,at});
      }
      // 歡呼「耶～」：多個聲部往上滑
      for(let k=0;k<7;k++){
        if(!ctx) break;
        const t=now()+.12+Math.random()*.1, o=ctx.createOscillator(), f=ctx.createBiquadFilter(), g=ctx.createGain(), lfo=ctx.createOscillator(), lg=ctx.createGain();
        const base=320+Math.random()*260;
        o.type="sawtooth"; o.frequency.setValueAtTime(base,t); o.frequency.linearRampToValueAtTime(base*1.35,t+.35); o.frequency.linearRampToValueAtTime(base*1.2,t+.9);
        lfo.frequency.value=5+Math.random()*2; lg.gain.value=base*.03; lfo.connect(lg); lg.connect(o.frequency);
        f.type="bandpass"; f.frequency.value=1100+Math.random()*500; f.Q.value=1.4;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.045,t+.08); g.gain.exponentialRampToValueAtTime(.0001,t+1);
        o.connect(f); f.connect(g); g.connect(sfxBus); o.start(t); lfo.start(t); o.stop(t+1.05); lfo.stop(t+1.05);
      }
      // 閃亮音收尾
      [84,88,91,96].forEach((n,i)=>tone(N(n),.5,{vol:.07,at:.5+i*.08}));
    },
    whoosh(){ noise(.3,{vol:.25,freq:400,to:3000,Q:1.2}); tone(300,.25,{vol:.06,to:700}); },
    close(){ tone(880,.14,{vol:.14,to:440}); },
    add(){ [72,76,79,84].forEach((n,i)=>tone(N(n),.16,{type:"triangle",vol:.16,at:i*.06})); },
    clear(){ [79,74,71,67].forEach((n,i)=>tone(N(n),.14,{type:"triangle",vol:.13,at:i*.06})); },
    // 飯糰君
    boing(){ const o=tone(300,.32,{type:"sine",vol:.3,to:620}); tone(620,.18,{type:"triangle",vol:.12,at:.12,to:380}); },
    rumble(){ // 肚子咕嚕咕嚕
      for(let i=0;i<5;i++){ tone(70+Math.random()*30,.16,{type:"triangle",vol:.28,at:i*.13,to:55+Math.random()*25}); tone(140+Math.random()*40,.12,{type:"sine",vol:.08,at:i*.13+.03}); }
    },
    content(){ [N(79),N(84),N(88)].forEach((f,i)=>tone(f,.3,{type:"sine",vol:.12,at:i*.09})); tone(N(91),.5,{type:"triangle",vol:.06,at:.27}); },
    burp(){ tone(120,.22,{type:"sawtooth",vol:.09,to:80}); noise(.18,{vol:.12,freq:400,Q:2}); [N(84),N(88)].forEach((f,i)=>tone(f,.25,{vol:.08,at:.3+i*.08})); },
    love(){ [N(84),N(88),N(91),N(96)].forEach((f,i)=>tone(f,.35,{type:"sine",vol:.1,at:i*.07})); tone(N(100),.6,{vol:.05,at:.3}); },
    whisper(){ noise(.35,{vol:.16,freq:2500,Q:.8,to:4500}); tone(N(76),.12,{type:"triangle",vol:.06,at:.05}); },
    gasp(){ tone(500,.25,{type:"triangle",vol:.18,to:1100}); noise(.2,{vol:.12,freq:1800,Q:1}); [N(72),N(66)].forEach((f,i)=>tone(f,.3,{type:"square",vol:.05,at:.25+i*.18})); },
    giggle(){ for(let i=0;i<4;i++) tone(700+i*60,.07,{type:"triangle",vol:.12,at:i*.09,to:900+i*60}); },
    grumble(){ // 生氣：噗噗噗＋冒煙
      for(let i=0;i<4;i++) tone(110-i*6,.1,{type:"sawtooth",vol:.12,at:i*.1,to:90});
      noise(.5,{vol:.12,at:.2,type:"highpass",freq:3000,Q:.7});
    },
    chime(){ tone(N(88),.4,{vol:.1}); tone(N(93),.5,{vol:.08,at:.08}); },
  };

  /* ---------- 背景音樂：音樂盒風 8 小節循環 ----------
     先用 OfflineAudioContext 一次「錄」成一段 buffer，再無縫循環播放，
     不靠計時器即時排音符 → 手機忙或切背景也不會斷斷續續 */
  const BPM=104, S16=60/BPM/4, LOOP=S16*16*8;
  const MEL=[
    76,79,84,0, 79,76,81,79,
    84,0,83,81, 76,0,81,83,
    81,84,89,0, 84,81,79,77,
    79,83,86,0, 83,0,79,0,
    88,86,84,0, 79,76,79,84,
    81,0,79,76, 72,76,81,79,
    77,81,84,81, 79,77,76,74,
    74,79,83,86, 84,0,0,0 ];
  const CH=[[48,55,64],[45,52,60],[41,48,57],[43,50,59],[48,55,64],[45,52,60],[41,48,57],[43,50,59]];
  /* 背景音樂改用 <audio> 播放：
     頁面一載入就用 OfflineAudioContext 把 8 小節「錄」成 WAV，交給 <audio loop> 播。
     iPhone 對 <audio> 的播放最穩定，不會因為取樣率不同或畫面忙碌而斷斷續續。 */
  const BGM_SR=32000, BGM_VOL=.42;
  let bgmEl=null, bgmReady=false, bgmWant=false, bgmPlaying=false;
  function encodeWav(f32,sr){
    const n=f32.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
    const w=(o,str)=>{for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i));};
    w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){ const x=Math.max(-1,Math.min(1,f32[i])); v.setInt16(44+i*2, x<0?x*0x8000:x*0x7FFF, true); }
    return new Blob([buf],{type:"audio/wav"});
  }
  function prepareBgm(){
    try{
      const sr=BGM_SR, TAIL=1.2;
      const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!OAC) return;
      const oc=new OAC(1,Math.ceil((LOOP+TAIL)*sr),sr);
      const out=oc.createGain(); out.gain.value=BGM_VOL; out.connect(oc.destination);
      const nb=oc.createBuffer(1,Math.floor(sr*.2),sr); const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
      const env=(g,t,v,a,d)=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);};
      const box=(f,t,v)=>{const o=oc.createOscillator(),o2=oc.createOscillator(),g=oc.createGain(),g2=oc.createGain();
        o.frequency.value=f;o2.frequency.value=f*4.01;g2.gain.value=.12;env(g,t,v,.004,.9);
        o.connect(g);o2.connect(g2);g2.connect(g);g.connect(out);o.start(t);o2.start(t);o.stop(t+1);o2.stop(t+1);};
      const pluck=(f,t,v,d)=>{const o=oc.createOscillator(),g=oc.createGain();o.type="triangle";o.frequency.value=f;env(g,t,v,.01,d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05);};
      const shake=(t,v)=>{const s2=oc.createBufferSource(),f=oc.createBiquadFilter(),g=oc.createGain();s2.buffer=nb;f.type="highpass";f.frequency.value=6000;
        g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s2.connect(f);f.connect(g);g.connect(out);s2.start(t);s2.stop(t+.06);};
      for(let st=0;st<128;st++){
        const t=st*S16, bar=Math.floor(st/16), x=st%16, ch=CH[bar];
        if(x%2===0){const n=MEL[bar*8+x/2]; if(n) box(N(n),t,.11);}
        if(x===0) pluck(N(ch[0]-12),t,.16,.7);
        if(x===8) pluck(N(ch[0]-5),t,.12,.5);
        if(x===4||x===12){pluck(N(ch[1]),t,.05,.25);pluck(N(ch[2]),t,.05,.25);}
        if(x%4===2) shake(t,.035);
      }
      oc.startRendering().then(buf=>{
        const d=buf.getChannelData(0), L=Math.floor(LOOP*sr);
        const loop=new Float32Array(L*2);                       // 放兩輪，減少循環接縫次數
        for(let i=0;i<L;i++){ const v=d[i]+(i+L<d.length?d[i+L]:0); loop[i]=v; loop[i+L]=v; }
        bgmEl=new Audio(); bgmEl.loop=true; bgmEl.preload="auto"; bgmEl.setAttribute("playsinline","");
        bgmEl.src=URL.createObjectURL(encodeWav(loop,sr));
        bgmReady=true;
        if(bgmWant) startBgm();
      }).catch(()=>{});
    }catch(e){}
  }
  prepareBgm();
  // 同時開好幾個（桌面 App、瀏覽器分頁）時，只讓最後開始播的那個播
  const myId=Math.random().toString(36).slice(2);
  let bc=null; try{ bc=new BroadcastChannel("lunch-bgm"); bc.onmessage=e=>{ if(e.data&&e.data.claim&&e.data.id!==myId) stopBgm(); }; }catch(e){}
  window.addEventListener("storage",e=>{ if(e.key==="lunch_bgm_owner" && e.newValue && !e.newValue.startsWith(myId)) stopBgm(); });
  function claim(){ try{bc&&bc.postMessage({claim:1,id:myId});}catch(e){} try{localStorage.setItem("lunch_bgm_owner",myId+":"+Date.now());}catch(e){} }
  function startBgm(){
    if(!bgmOn||document.hidden||(typeof updating!=="undefined"&&updating)) return;
    bgmWant=true;
    if(!bgmReady||bgmPlaying) return;
    const pr=bgmEl.play(); bgmPlaying=true; claim();
    if(pr&&pr.catch) pr.catch(()=>{ bgmPlaying=false; });   // iPhone 擋自動播放 → 等下一次點擊
  }
  function stopBgm(){ bgmWant=false; bgmPlaying=false; if(bgmEl){ try{bgmEl.pause();}catch(e){} } }
  // 切到背景：停；回到前景：音樂是開的就繼續
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ const keep=bgmOn; stopBgm(); if(ctx&&ctx.suspend) ctx.suspend(); }
    else { if(ctx&&ctx.resume) ctx.resume().catch(()=>{}); if(bgmOn) startBgm(); }
  });
  window.addEventListener("pagehide",()=>{ stopBgm(); if(ctx){ try{ctx.close();}catch(e){} ctx=null; } });

  return {
    init,
    play(name,...a){ if(!sfxOn) return; if(!init()) return; sfx[name]&&sfx[name](...a); },
    clack(p){ if(ctx) sfx.clack(p); },
    get sfxOn(){return sfxOn}, get bgmOn(){return bgmOn},
    _state(){ return {ctx: ctx?ctx.state:"none", playing: bgmPlaying && bgmEl && !bgmEl.paused, ready: bgmReady}; },
    setSfx(v){ sfxOn=v; store.set("lunch_sfx",v); if(sfxBus){ sfxBus.gain.cancelScheduledValues(ctx.currentTime); sfxBus.gain.setValueAtTime(v?1:0,ctx.currentTime); } },
    setBgm(v){ bgmOn=v; store.set("lunch_bgm",v); v?startBgm():stopBgm(); init(); },
  };
})();

/* ===== 自動檢查更新 =====
   像 FW 的 OTA：去問伺服器上的 version.json，比手上的版本新就重新載入 */
let updating=false;
async function checkUpdate(){
  if(updating || !/github\.io$/.test(location.hostname)) return;
  try{
    const r = await fetch("version.json?t="+Date.now(), {cache:"no-store"});
    const j = await r.json();
    if(verNum(j.version) > verNum(APP_VERSION)){
      updating=true;
      const go=()=>location.replace(location.pathname+"?v="+j.version);
      if(document.body.classList.contains("booting")){ go(); }   // 還在開機畫面：直接換新版，不會看到兩次開機
      else if(!spinning && !$("#overlay").classList.contains("show")){ toast("有新版本 v"+j.version+"，更新中…"); setTimeout(go,900); }
      else { toast("有新版本 v"+j.version+"，關掉視窗後自動更新"); const t=setInterval(()=>{ if(!spinning && !$("#overlay").classList.contains("show")){clearInterval(t);go();} },1000); }
    }
  }catch(e){}
}
if(location.search.includes("v=")) try{ history.replaceState(null,"",location.pathname); }catch(e){}
checkUpdate();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ checkUpdate(); try{ document.getAnimations().forEach(a=>{ if(a.playState!=="finished"){ a.pause(); a.play(); } }); }catch(e){} } });
window.addEventListener("pageshow",e=>{ if(e.persisted) checkUpdate(); });

    love:   ()=>[37,63].map(x=>`<path transform="translate(${x} 51)" d="M0 4 Q-7 -1 -4.5 -4.5 Q-2 -7 0 -3.5 Q2 -7 4.5 -4.5 Q7 -1 0 4Z" fill="#F26B5B" stroke="${I}" stroke-width="1.6"/>`).join("")+cheeks("1",7)+`<path d="M44 57 Q50 63 56 57" ${L}/>`,
    happy:  ()=>`<path d="M32 54 Q37 47 42 54 M58 54 Q63 47 68 54" ${L}/>`+cheeks()+`<path d="M42 57 Q50 66 58 57" ${L}/>`,
    sly:    ()=>`<path d="M31 51 H43 M57 51 H69" ${L}/><circle cx="40" cy="53" r="2.6" fill="${I}"/><circle cx="66" cy="53" r="2.6" fill="${I}"/>`+cheeks(".7")+`<path d="M44 59 Q52 63 58 57" ${L}/>`,
    shock:  ()=>`<circle cx="37" cy="51" r="6" fill="#fff" stroke="${I}" stroke-width="2.6"/><circle cx="63" cy="51" r="6" fill="#fff" stroke="${I}" stroke-width="2.6"/><circle cx="37" cy="51" r="2.4" fill="${I}"/><circle cx="63" cy="51" r="2.4" fill="${I}"/>`+cheeks(".6")+`<ellipse cx="50" cy="61" rx="4.5" ry="5.5" fill="${I}"/>`,
    angry:  ()=>`<path d="M30 43 L43 48 M70 43 L57 48" ${L}/>`+`<circle cx="38" cy="53" r="3.4" fill="${I}"/><circle cx="62" cy="53" r="3.4" fill="${I}"/>`+
            `<ellipse cx="28" cy="60" rx="7" ry="4" fill="#F26B5B" opacity=".75"/><ellipse cx="72" cy="60" rx="7" ry="4" fill="#F26B5B" opacity=".75"/>`+
            `<path d="M43 62 Q50 56 57 62" ${L}/>`,
  };
  const FX = {
    angry: `<g stroke="#F26B5B" stroke-width="3" stroke-linecap="round" fill="none"><path d="M74 18 Q78 22 82 18 M78 14 Q82 18 78 22"/></g>
            <g fill="#fff" stroke="${I}" stroke-width="2"><circle cx="16" cy="20" r="5"><animate attributeName="cy" values="22;8" dur=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur=".7s" repeatCount="indefinite"/></circle>
            <circle cx="86" cy="30" r="4"><animate attributeName="cy" values="30;14" dur=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur=".8s" repeatCount="indefinite"/></circle></g>`,
    hungry:`<text x="78" y="88" font-size="13" font-weight="900" fill="${I}" font-family="Zen Maru Gothic, sans-serif">咕<animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></text>`,
    full:  `<g fill="#FFE08A" stroke="${I}" stroke-width="1.6"><path d="M84 20 Q85 26 91 27 Q85 28 84 34 Q83 28 77 27 Q83 26 84 20Z"><animateTransform attributeName="transform" type="rotate" values="0 84 27;20 84 27;0 84 27" dur="1s" repeatCount="indefinite"/></path></g>`,
    love:  `<path d="M84 26 Q76 20 79 15 Q82 11 84 15 Q86 11 89 15 Q92 20 84 26Z" fill="#F26B5B" stroke="${I}" stroke-width="1.6"><animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 4;0 -10" dur="1.2s" repeatCount="indefinite"/></path>`,
    whisper:`<g fill="none" stroke="#9A8574" stroke-width="2.4" stroke-linecap="round"><path d="M86 40 Q90 44 86 48"><animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></path><path d="M91 36 Q97 44 91 52"><animate attributeName="opacity" values="0;1;0" dur="1s" begin=".25s" repeatCount="indefinite"/></path></g>`,
    poked: `<g stroke="#F28C6E" stroke-width="3" stroke-linecap="round"><path d="M8 34 L2 30 M10 24 L5 17 M92 34 L98 30 M90 24 L95 17"/></g>`,
  };
  const MOODS = [
    ["hungry","肚子好餓～","rumble"],
    ["full","吃飽飽～♪","content"],
    ["hungry","中午吃什麼？","rumble"],
    ["full","嗝～好滿足","burp"],
    ["happy","嘿嘿，好癢","giggle"],
  ];
  const ANGRY_LINES=["不要一直戳啦！","哼！生氣了！","再戳我就不幫你選了！"];
  // 生氣冷靜後的八卦彩蛋：依序一句一句講
  const GOSSIP=[
    ["sly","我這裡有一個八卦…","whisper"],
    ["sly","聽說通Ｘ科技…","whisper"],
    ["shock","高層全部一次換血！","gasp"],
    ["happy","嘿嘿","giggle"],
  ];
  // 講完八卦後，正常戳幾下會冒出冷知識
  const TRIVIA=[
    [3,"sly","你知道「海老」是蝦子的意思嗎？","whisper"],
    [2,"sly","你知道煤燈效應是什麼嗎？","whisper"],
  ];
  let state="normal", timer=null, taps=[], moodIdx=0, angryUntil=0, gossip=-1;
  let gossipDone=false, triviaIdx=0, normalCount=0;
  const el=()=>document.getElementById("mascot");
  function set(face, cls, fx){
    document.getElementById("mFace").innerHTML=FACES[face]();
    document.getElementById("mFx").innerHTML=fx?FX[fx]||"":"";
    const m=el(); m.classList.remove("poke","angry","full","hungry","love");
    if(cls){ void m.getBoundingClientRect(); m.classList.add(cls); }
    state=face;
  }
  function say(text,cls){
    const b=document.getElementById("mBubble"); b.className="mBubble"+(cls?" "+cls:"");
    if(!text) return; b.textContent=text; void b.offsetWidth; b.classList.add("show");
  }
  function back(ms){ clearTimeout(timer); timer=setTimeout(()=>{ set("normal"); say(""); },ms); }
  let gTimer=null;
  function poke(){
    const t=Date.now(); taps=taps.filter(x=>t-x<2200); taps.push(t);
    if(taps.length>=5 || t<angryUntil){
      angryUntil=t+3000; taps=[];
      set("angry","angry","angry"); say(ANGRY_LINES[Math.floor(Math.random()*ANGRY_LINES.length)],"angry");
      Snd.play("grumble"); back(3000); gossip = gossipDone ? -2 : 0; return;
    }
    clearTimeout(timer);
    if(gossip===-2){   // 八卦已經講過了
      gossip=-1; set("sly","poke",""); say("我這邊已經沒八卦了","hungry"); Snd.play("giggle"); back(2600); return;
    }
    if(gossip>=0){
      const [face,line,snd]=GOSSIP[gossip]; gossip = gossip+1<GOSSIP.length ? gossip+1 : -1;
      if(gossip===-1){ gossipDone=true; normalCount=0; }
      set(face,"poke",face==="sly"?"whisper":""); say(line, face==="shock"?"angry":"hungry"); Snd.play(snd);
      back(gossip===-1?2200:6000);   // 八卦講到一半可以慢慢按
      if(gossip!==-1){ clearTimeout(gTimer); gTimer=setTimeout(()=>{gossip=-1;},6000); }
      return;
    }
    if(gossipDone && triviaIdx<TRIVIA.length && ++normalCount>=TRIVIA[triviaIdx][0]){
      const [,face,line,snd]=TRIVIA[triviaIdx++]; normalCount=0;
      set(face,"poke","whisper"); say(line,"hungry"); Snd.play(snd); back(3600); return;
    }
    set("poked","poke","poked"); say("");
    Snd.play("boing");
    timer=setTimeout(()=>{
      const [face,line,snd]=MOODS[moodIdx++ % MOODS.length];
      set(face, face==="happy"?"":face, face==="happy"?"":face);
      say(line, face); Snd.play(snd);
      back(2800);
    },480);
  }
  // 閒置時偶爾眨眼
  setInterval(()=>{ if(state!=="normal") return; set("blink"); setTimeout(()=>{ if(state==="blink") set("normal"); },160); }, 3800);
  set("normal");
  return {poke};
})();

let current=null, spinning=false, handleDeg=0;
function spin(){
  const list=candidates(); if(!list.length||spinning) return;
  spinning=true; document.querySelector(".gacha").classList.add("busy");
  const out=$("#outcap"); out.classList.remove("drop"); out.style.opacity=0;
  stirring=true; $("#mbody").classList.add("shake");
  Snd.play("crank");
  handleDeg+=720; $("#handle").style.transform=`rotate(${handleDeg}deg)`;
  let pick=list[Math.floor(Math.random()*list.length)];
  if(list.length>1 && current && pick.id===current.id){const o=list.filter(r=>r.id!==current.id);pick=o[Math.floor(Math.random()*o.length)];}
  let n=0; const total=18;
  const tick=()=>{
    const r = n<total-1 ? list[Math.floor(Math.random()*list.length)] : pick;
    $("#ticker").innerHTML = restIcon(r,26)+esc(r.name);
    Snd.play("tick",n,total);
    n++;
    if(n<total) setTimeout(tick,45+n*n*1.5);
    else {
      stirring=false; $("#mbody").classList.remove("shake");
      const col=CAP_COLORS[Math.floor(Math.random()*6)];
      out.style.setProperty("--c",col); void out.offsetWidth; out.classList.add("drop"); Snd.play("drop");
      setTimeout(()=>{spinning=false;document.querySelector(".gacha").classList.remove("busy");showResult(pick,col);},950);
    }
  };
  tick();
}

/* ===== Q 版小地圖（示意圖，不是真的地圖）===== */
const RIVER = [[121.08,24.785],[121.05,24.793],[121.03,24.799],[121.005,24.806],[120.985,24.813],[120.965,24.821],[120.94,24.832]];
function miniMap(r){
  const a = AREAS[r.area], W=320, H=168;
  // 取出發點與目的地的範圍，最少 1.8km，等比例縮放
  const cLat=(ORIGIN.lat+a.lat)/2, cLng=(ORIGIN.lng+a.lng)/2;
  const spanX=Math.max(Math.abs(a.lng-ORIGIN.lng)*101, 1.8), spanY=Math.max(Math.abs(a.lat-ORIGIN.lat)*110.9, 1.0);
  const k=Math.min((W-90)/spanX,(H-70)/spanY);           // px per km
  const P=(lat,lng)=>[W/2+(lng-cLng)*101*k + 18, H/2-(lat-cLat)*110.9*k + 8];
  const [sx,sy]=P(ORIGIN.lat,ORIGIN.lng), [dx,dy]=P(a.lat,a.lng);
  // 路線：一條彎彎的虛線
  const mx=(sx+dx)/2, my=(sy+dy)/2, len=Math.hypot(dx-sx,dy-sy)||1;
  const cx=mx+(-(dy-sy)/len)*len*.22, cy=my+((dx-sx)/len)*len*.22;
  const route=`M${sx.toFixed(1)} ${sy.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${dx.toFixed(1)} ${dy.toFixed(1)}`;
  const river=RIVER.map(([lng,lat],i)=>{const [x,y]=P(lat,lng);return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}).join(" ");
  // 小裝飾：樹和房子（固定亂數，每間店長得一樣）
  let seed=[...r.name].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7); const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
  let deco="";
  for(let i=0;i<9;i++){
    const x=20+rnd()*(W-40), y=20+rnd()*(H-36);
    if(Math.hypot(x-dx,y-dy)<34||Math.hypot(x-sx,y-sy)<22||(x<120&&y<56)) continue;
    deco += rnd()<.6
      ? `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><rect x="-1.5" y="2" width="3" height="6" fill="#B97A4E"/><circle r="7" fill="#9ED7A8" stroke="${O}" stroke-width="2"/></g>`
      : `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><path d="M-8 0 L0 -8 L8 0Z" fill="#FF9C86" stroke="${O}" stroke-width="2" stroke-linejoin="round"/><rect x="-6" y="0" width="12" height="9" fill="#fff" stroke="${O}" stroke-width="2"/></g>`;
  }
  const label=(t,lat,lng)=>{const [x,y]=P(lat,lng);return `<text x="${x.toFixed(0)}" y="${y.toFixed(0)}" font-size="15" font-weight="900" fill="#5A4434" opacity=".16" text-anchor="middle" font-family="Zen Maru Gothic, PingFang TC, sans-serif">${t}</text>`;};
  const pill=(t,x,y)=>{const w=t.length*15+18;x=Math.min(Math.max(x,w/2+6),W-w/2-6);y=Math.min(Math.max(y,14),H-14);
    return `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><rect x="${-w/2}" y="-12" width="${w}" height="24" rx="12" fill="#fff" stroke="${O}" stroke-width="2.5"/><text y="5.5" font-size="14" font-weight="900" fill="${O}" text-anchor="middle" font-family="Zen Maru Gothic, PingFang TC, sans-serif">${t}</text></g>`;};
  const cross = a.region!=="zb";
  const tags = cross ? (Math.abs(dx-sx)<70 ? pill("竹北",sx+42,sy) : pill("竹北",sx+(sx<dx?-8:8),sy+(sy<dy?-22:22))) + pill(REGIONS[a.region],dx+(dx<sx?-34:34),dy+10) : "";
  const near = a.walk<=8;
  const head = near ? `${ui("walk",20)}走路約 ${a.walk} 分` : `${ui("car",20)}開車約 ${a.min} 分`;
  const subTxt = near ? `約 ${a.road.toFixed(1)} 公里・開車約 ${a.min} 分` : `約 ${a.road.toFixed(1)} 公里${a.walk<=15?`・走路約 ${a.walk} 分`:""}`;
  return `<div class="mini">
    <svg viewBox="0 0 ${W} ${H}">
      <defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#E2EFD6" stroke-width="2"/></pattern></defs>
      <rect width="${W}" height="${H}" fill="url(#grid)"/>
      <path d="${river}" fill="none" stroke="#BFDDF7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${river}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 10" opacity=".8"/>
      ${deco}
      <path d="${route}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      <path d="${route}" fill="none" stroke="#F28C6E" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"><animate attributeName="stroke-dashoffset" from="22" to="0" dur=".8s" repeatCount="indefinite"/></path>
      <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="6" fill="#fff" stroke="${O}" stroke-width="3"/>
      <g><svg x="-13" y="-13" width="26" height="26" viewBox="0 0 24 24" overflow="visible">${UI.car}</svg>
        <animateMotion dur="2.6s" repeatCount="indefinite" path="${route}" keyTimes="0;1" keySplines=".4 0 .6 1" calcMode="spline"/></g>
      ${tags}
      <g transform="translate(${dx.toFixed(1)} ${dy.toFixed(1)})">
        <ellipse cx="0" cy="2" rx="10" ry="4" fill="#5A4434" opacity=".18"/>
        <path d="M0 0 Q-17 -20 -17 -32 A17 17 0 0 1 17 -32 Q17 -20 0 0Z" fill="#FFB59E" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="0" cy="-32" r="12" fill="#fff" stroke="${O}" stroke-width="2"/>
        <g transform="translate(-11 -43)">${restIcon(r,22)}</g>
        <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -4;0 0" dur="1.4s" repeatCount="indefinite"/>
      </g>
    </svg>
    <div class="eta"><b>${head}</b><span>${subTxt}</span></div>
  </div>`;
}

/* ===== 開機畫面：扭蛋機彈出 → 扭蛋一顆顆冒出 → 把手轉一圈 → 字一個個跳出 → 飛到首頁對應位置 ===== */
(function(){
  const sp=$("#splash"); if(!sp){ splashDoneR(); return; }
  const real=document.querySelector("#machineCard .gacha");
  const g=real.cloneNode(true);
  g.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
  g.querySelectorAll(".callout,.halo").forEach(e=>e.remove());
  g.querySelectorAll(".cap").forEach((c,i)=>c.style.setProperty("--i",i));
  g.classList.remove("busy","empty");
  $("#spStage").appendChild(g);
  $("#spTitle").innerHTML=[..."台元午餐轉轉"].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join("");
  setTimeout(()=>sp.classList.add("sp-live"),150);   // 先停在跟 iPhone 啟動圖一樣的空白底色，再開始動
  let out=false;
  function exit(){
    if(out) return; out=true;
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const finish=()=>{ sp.remove(); document.body.classList.remove("sp-flying"); setTimeout(()=>document.body.classList.remove("enter"),900); splashDoneR(); };
    document.body.classList.remove("booting");
    if(reduce){ document.body.classList.add("enter"); sp.classList.add("sp-fade"); setTimeout(finish,520); return; }
    window.scrollTo(0,0);
    document.body.classList.add("sp-flying","enter");
    // 扭蛋機和標題各自飛到首頁的位置（FLIP：先量起點和終點，再用 transform 補間）
    const fly=(el,target)=>{
      const a=el.getBoundingClientRect(), b=target.getBoundingClientRect();
      const sc=b.width/a.width;
      el.style.animation="none"; el.style.opacity="1";
      el.style.transition="transform .75s cubic-bezier(.6,0,.15,1)";
      el.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${sc})`;
    };
    const t=$("#spTitle"), h1=document.querySelector("header h1");
    // 起點、終點都用「文字本身」的框來量（Range），兩邊同一種量法，縮放後字形才會完全重疊
    const textBox=el=>{ const r=document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect(); };
    const tb0=t.getBoundingClientRect(), sw=[...t.children].reduce((w,c)=>w+c.getBoundingClientRect().width,0);
    t.style.left=(tb0.left+(tb0.width-sw)/2)+"px"; t.style.right="auto"; t.style.textAlign="left";
    const tr=textBox(h1.firstChild);   // 只量文字，不含版本標籤
    requestAnimationFrame(()=>{
      // 開機標題每個字包在 <span> 裡：量每個字的「文字節點」（不是 span 外框），跟首頁標題同一把尺
      const cs=[...t.children].map(c=>textBox(c.firstChild));
      const sr={left:cs[0].left, top:Math.min(...cs.map(r=>r.top)), width:cs[cs.length-1].right-cs[0].left};
      const sc=tr.width/sr.width, tl=t.getBoundingClientRect();
      // transform-origin 是左上角：縮放後文字框左上角 = tl + (sr - tl) * sc
      const dx=tr.left-(tl.left+(sr.left-tl.left)*sc), dy=tr.top-(tl.top+(sr.top-tl.top)*sc);
      t.style.transition="transform .75s cubic-bezier(.6,0,.15,1)";
      t.style.transform=`translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${sc.toFixed(4)})`;
      fly(g,real);
      sp.classList.add("sp-exit");
    });
    // 落地瞬間直接換手：飛過來的那份馬上消失、首頁的同時出現，不做交叉淡化，就不會有殘影
    let landed=false;
    const land=()=>{ if(landed) return; landed=true;
      t.style.visibility="hidden"; g.style.visibility="hidden";
      document.body.classList.remove("sp-flying"); sp.classList.add("sp-fade"); };
    t.addEventListener("transitionend",e=>{ if(e.propertyName==="transform") land(); },{once:true});
    setTimeout(land,820);
    setTimeout(finish,1150);
  }
  // 至少停 2.4 秒（字和標語都出來後再走）；保險最多 4 秒
  const wait=()=>setTimeout(()=>requestAnimationFrame(exit), Math.max(0,2400-(performance.now()-BOOT_T0)));
  if(document.fonts && document.fonts.ready) Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1200))]).then(wait); else wait();
  setTimeout(exit,4000);
})();

</script>
</body>
</html>
